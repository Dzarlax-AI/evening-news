name: Go extraction prototype

on:
  push:
    paths:
      - 'go/**'
      - 'go-tools/replaycheck/**'
      - 'go-tools/cmd/compare-extraction-replays/**'
      - 'docs/extraction-review-decisions.json'
      - 'docs/extraction-golden-cases.json'
      - 'tests/fixtures/go-parity/**'
      - '.github/workflows/go-prototype.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'go-tools/replaycheck/**'
      - 'go-tools/cmd/compare-extraction-replays/**'
      - 'docs/extraction-review-decisions.json'
      - 'docs/extraction-golden-cases.json'
      - 'tests/fixtures/go-parity/**'
      - '.github/workflows/go-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      check_prototype: ${{ steps.select.outputs.check_prototype }}
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - name: Select impacted checks
        id: select
        run: scripts/ci-impact.sh

  replay:
    needs: impact
    if: ${{ always() && (needs.impact.result != 'success' || needs.impact.outputs.check_prototype == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCHEDULER_ENABLED: 'false'
      NO_BROWSER: '1'
    steps:
      - name: Fail if impact selection failed
        if: ${{ needs.impact.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Replay comparison tests
        if: ${{ !contains(fromJSON(needs.impact.outputs.modules), 'go-tools') }}
        working-directory: go-tools
        run: |
          go test -race ./replaycheck ./cmd/compare-extraction-replays
          go vet ./replaycheck ./cmd/compare-extraction-replays
      - name: Replay the offline corpus with Go
        run: |
          mkdir -p artifacts
          cd go
          go run ./cmd/extract-replay -corpus ../tests/fixtures/go-parity/manifest.json -cycles 6 -workers 2 -output ../artifacts/go-replay.jsonl
      - name: Check every Go replay against frozen source goldens
        run: |
          cd go-tools
          go run ./cmd/compare-extraction-replays --go ../artifacts/go-replay.jsonl --corpus ../tests/fixtures/go-parity/manifest.json --cycles 6 --golden ../docs/extraction-golden-cases.json --output ../artifacts/replay-comparison.json
      - name: Save replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-component-replay
          path: |
            artifacts/go-replay.jsonl
            artifacts/replay-comparison.json
          if-no-files-found: warn
