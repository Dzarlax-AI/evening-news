name: Shared Cloak browser image

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'deploy/news-extractor/browser/**'
      - 'deploy/news-extractor/compose.shared-browser.yml'
      - 'deploy/news-extractor/compose.native.yml'
      - 'docker/Dockerfile.browser'
      - 'scripts/launch_shadow_cloak.py'
      - 'scripts/shadow_cdp_relay.py'
      - 'scripts/shadow_x11_client.sh'
      - 'go-tools/browsercontract/**'
      - '.github/workflows/shared-browser.yml'
  push:
    paths:
      - '.dockerignore'
      - 'deploy/news-extractor/browser/**'
      - 'deploy/news-extractor/compose.shared-browser.yml'
      - 'deploy/news-extractor/compose.native.yml'
      - 'docker/Dockerfile.browser'
      - 'scripts/launch_shadow_cloak.py'
      - 'scripts/shadow_cdp_relay.py'
      - 'scripts/shadow_x11_client.sh'
      - 'go-tools/browsercontract/**'
      - '.github/workflows/shared-browser.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a verified browser image from main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      check_browser: ${{ steps.select.outputs.check_browser }}
      image_changed_browser: ${{ steps.select.outputs.image_changed_browser }}
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - name: Select impacted checks
        id: select
        env:
          CI_IMPACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_IMPACT_BASE: ${{ github.event.before }}
        run: scripts/ci-impact.sh

  verify:
    needs: impact
    if: ${{ always() && (needs.impact.result != 'success' || ((needs.impact.outputs.check_browser == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && (needs.impact.outputs.image_changed_browser == 'true' || !contains(fromJSON(needs.impact.outputs.modules), 'go-tools') || (github.event_name == 'workflow_dispatch' && inputs.publish)))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail if impact selection failed
        if: ${{ needs.impact.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - name: Build browser image for inspection on pull requests and branch pushes
        if: ${{ needs.impact.outputs.image_changed_browser == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.browser
          platforms: linux/amd64
          push: false
          load: true
          tags: evening-news-browser:test-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Inspect and import the built browser runtime
        if: ${{ needs.impact.outputs.image_changed_browser == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          set -euo pipefail
          docker image inspect evening-news-browser:test-${GITHUB_SHA} \
            --format '{{json .Config.Entrypoint}} {{json .Config.Healthcheck.Test}}' \
            | grep -F '"/opt/news-browser/entrypoint.py"'
          docker run --rm --entrypoint python evening-news-browser:test-${GITHUB_SHA} \
            -m py_compile /opt/news-browser/entrypoint.py /opt/news-browser/policy.py
          docker run --rm --entrypoint python evening-news-browser:test-${GITHUB_SHA} \
            -c 'import sys; sys.path.insert(0, "/opt/news-browser"); import entrypoint, policy; print("browser imports ok")'
      - name: Verify in-image policy, relay and Compose contracts
        if: ${{ needs.impact.outputs.image_changed_browser == 'true' || !contains(fromJSON(needs.impact.outputs.modules), 'go-tools') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        working-directory: go-tools
        env:
          NEWS_BROWSER_IMAGE: evening-news-browser:test-${{ github.sha }}
          NEWS_BROWSER_CONTRACT_REQUIRED: ${{ (needs.impact.outputs.image_changed_browser == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && '1' || '0' }}
        run: |
          go test -race -count=1 ./browsercontract
          go vet ./browsercontract

  publish-candidate:
    needs: [impact, verify]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - name: Build the local candidate once
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.browser
          platforms: linux/amd64
          push: false
          load: true
          tags: evening-news-browser:release-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Inspect and import the local candidate
        run: |
          set -euo pipefail
          image="evening-news-browser:release-${GITHUB_SHA}"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker image inspect "$image" --format '{{json .Config.Entrypoint}} {{json .Config.Healthcheck.Test}}' | grep -F '"/opt/news-browser/entrypoint.py"'
          docker run --rm --entrypoint python "$image" -m py_compile /opt/news-browser/entrypoint.py /opt/news-browser/policy.py
          docker run --rm --entrypoint python "$image" -c 'import sys; sys.path.insert(0, "/opt/news-browser"); import entrypoint, policy; print("browser imports ok")'
          printf 'BROWSER_CANDIDATE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
      - name: Verify the local candidate's policy, relay and Compose contracts
        working-directory: go-tools
        env:
          NEWS_BROWSER_IMAGE: evening-news-browser:release-${{ github.sha }}
          NEWS_BROWSER_CONTRACT_REQUIRED: '1'
        run: |
          go test -race -count=1 ./browsercontract
          go vet ./browsercontract
      - name: Verify candidate identity after testing
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "evening-news-browser:release-${GITHUB_SHA}")" = "$BROWSER_CANDIDATE_ID"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image contents and record its digest
        run: |
          set -euo pipefail
          log_file="$(mktemp "$RUNNER_TEMP/browser-push.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          image_ref="ghcr.io/dzarlax-ai/rss-browser:sha-${GITHUB_SHA}"
          docker tag "$BROWSER_CANDIDATE_ID" "$image_ref"
          docker push "$image_ref" | tee "$log_file"
          digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$log_file" | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ghcr.io/dzarlax-ai/rss-browser@%s\n' "$digest" > browser-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: browser-image-reference
          path: browser-image.txt
          retention-days: 14
