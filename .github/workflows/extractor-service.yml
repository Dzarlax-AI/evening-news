name: Extractor service

on:
  pull_request:
    paths:
      - 'go/**'
      - 'news_aggregator/extraction/**'
      - 'news_aggregator/config.py'
      - 'news_aggregator/processing/**'
      - 'news_aggregator/services/ai_client.py'
      - 'tests/test_extractor_service*'
      - 'tests/fixtures/**'
      - 'scripts/benchmark_python_pipeline.py'
      - 'scripts/smoke_extractor_service.py'
      - 'scripts/compare_extractor_service.py'
      - 'deploy/news-extractor/**'
      - 'docker/Dockerfile.extractor'
      - 'docker-compose.extractor-test.yml'
      - '.github/workflows/extractor-service.yml'
  push:
    paths:
      - 'go/**'
      - 'news_aggregator/extraction/**'
      - 'news_aggregator/config.py'
      - 'news_aggregator/processing/**'
      - 'news_aggregator/services/ai_client.py'
      - 'tests/test_extractor_service*'
      - 'tests/fixtures/**'
      - 'scripts/benchmark_python_pipeline.py'
      - 'scripts/smoke_extractor_service.py'
      - 'scripts/compare_extractor_service.py'
      - 'deploy/news-extractor/**'
      - 'docker/Dockerfile.extractor'
      - 'docker-compose.extractor-test.yml'
      - '.github/workflows/extractor-service.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified extractor image from the default branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: evening_news_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d evening_news_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCHEDULER_ENABLED: 'false'
      NO_BROWSER: '1'
      EXTRACTOR_TEST_TOKEN: isolated-ci-token
      EXTRACTOR_TEST_VERSION: ${{ github.sha }}
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-only@127.0.0.1:5432/evening_news_test
      EXTRACTION_SERVICE_MODE: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test Go contracts and lifecycle
        working-directory: go
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go mod verify
      - name: Test Python service integration
        run: python -m pytest tests -q
      - name: Build independent image and start isolated service
        run: docker compose --env-file /dev/null -f docker-compose.extractor-test.yml up -d --build --wait
      - name: Smoke API through the Python client
        run: python scripts/smoke_extractor_service.py --endpoint http://127.0.0.1:18080 --expected-build "$EXTRACTOR_TEST_VERSION"
      - name: Compare captured input outside the processing pipeline
        run: python scripts/compare_extractor_service.py --corpus tests/fixtures/extractor-service/source-content-smoke.json --cycles 6 --endpoint http://127.0.0.1:18080 --output artifacts/extractor-service-comparison.json
      - name: Inspect isolated service on failure
        if: failure()
        run: docker compose --env-file /dev/null -f docker-compose.extractor-test.yml logs --tail 80
      - name: Remove isolated service
        if: always()
        run: docker compose --env-file /dev/null -f docker-compose.extractor-test.yml down

  publish:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish independent SHA-tagged image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: ./go
          file: ./docker/Dockerfile.extractor
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dzarlax-ai/rss-extractor:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=extractor-service
          cache-to: type=gha,mode=max,scope=extractor-service
      - name: Record exact release digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'ghcr.io/dzarlax-ai/rss-extractor@%s\n' "$IMAGE_DIGEST" > extractor-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: extractor-image-reference
          path: extractor-image.txt
