name: Extractor service

on:
  pull_request:
    paths:
      - 'go/**'
      - 'news_aggregator/extraction/**'
      - 'news_aggregator/telegram/**'
      - 'news_aggregator/sources/**'
      - 'news_aggregator/core/**'
      - 'news_aggregator/config.py'
      - 'news_aggregator/processing/**'
      - 'news_aggregator/services/ai_client.py'
      - 'news_aggregator/services/source_manager.py'
      - 'tests/test_extractor_service*'
      - 'tests/test_telegram*'
      - 'tests/test_page_monitor*'
      - 'tests/test_source_manager*'
      - 'tests/test_public_feed_template_security.py'
      - 'web/templates/public/_feed_core.html'
      - 'tests/test_browser*'
      - 'tests/test_native*'
      - 'tests/test_shadow_cdp_relay*'
      - 'tests/test_linux_vps_gate_harness.py'
      - 'tests/test_processing_batches.py'
      - 'tests/fixtures/**'
      - 'scripts/native_*.py'
      - 'scripts/run_native_*.py'
      - 'scripts/run_go_cloak_linux_gate.py'
      - 'scripts/shadow_cdp_relay.py'
      - 'scripts/smoke_extractor_service.py'
      - 'scripts/compare_extractor_service.py'
      - 'deploy/news-extractor/**'
      - 'docker/Dockerfile.extractor'
      - 'docker-compose.extractor-test.yml'
      - '.github/workflows/extractor-service.yml'
  push:
    paths:
      - 'go/**'
      - 'news_aggregator/extraction/**'
      - 'news_aggregator/telegram/**'
      - 'news_aggregator/sources/**'
      - 'news_aggregator/core/**'
      - 'news_aggregator/config.py'
      - 'news_aggregator/processing/**'
      - 'news_aggregator/services/ai_client.py'
      - 'news_aggregator/services/source_manager.py'
      - 'tests/test_extractor_service*'
      - 'tests/test_telegram*'
      - 'tests/test_page_monitor*'
      - 'tests/test_source_manager*'
      - 'tests/test_public_feed_template_security.py'
      - 'web/templates/public/_feed_core.html'
      - 'tests/test_browser*'
      - 'tests/test_native*'
      - 'tests/test_shadow_cdp_relay*'
      - 'tests/test_linux_vps_gate_harness.py'
      - 'tests/test_processing_batches.py'
      - 'tests/fixtures/**'
      - 'scripts/native_*.py'
      - 'scripts/run_native_*.py'
      - 'scripts/run_go_cloak_linux_gate.py'
      - 'scripts/shadow_cdp_relay.py'
      - 'scripts/smoke_extractor_service.py'
      - 'scripts/compare_extractor_service.py'
      - 'deploy/news-extractor/**'
      - 'docker/Dockerfile.extractor'
      - 'docker-compose.extractor-test.yml'
      - '.github/workflows/extractor-service.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified extractor image from the default branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: evening_news_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d evening_news_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCHEDULER_ENABLED: 'false'
      NO_BROWSER: '1'
      EXTRACTOR_TEST_TOKEN: isolated-ci-token
      EXTRACTOR_TEST_VERSION: ${{ github.sha }}
      EXTRACTION_SERVICE_URL: http://extractor.invalid:8080
      EXTRACTION_SERVICE_TOKEN: isolated-extraction-service-token
      SCHEDULER_API_URL: https://scheduler.invalid
      SCHEDULER_API_TOKEN: isolated-scheduler-api-token
      SCHEDULED_JOBS_TOKEN: isolated-scheduled-jobs-token
      ARTICLE_INGESTION_MODE: go
      ARTICLE_INGESTION_URL: http://ingestion.invalid:8093
      ARTICLE_INGESTION_TOKEN: isolated-article-ingestion-token
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-only@127.0.0.1:5432/evening_news_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Test Go contracts and lifecycle
        working-directory: go
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go mod verify
      - name: Test Python service integration
        run: python -m pytest tests -q
      - name: Build independent image and start isolated service
        run: docker compose --env-file /dev/null -f docker-compose.extractor-test.yml up -d --build --wait
      - name: Smoke API through the Python client
        run: python scripts/smoke_extractor_service.py --endpoint http://127.0.0.1:18080 --expected-build "$EXTRACTOR_TEST_VERSION"
      - name: Compare captured input outside the processing pipeline
        run: python scripts/compare_extractor_service.py --corpus tests/fixtures/extractor-service/source-content-smoke.json --cycles 6 --endpoint http://127.0.0.1:18080 --output artifacts/extractor-service-comparison.json
      - name: Package verified CI candidate image (test only)
        run: |
          set -euo pipefail
          image_ref="evening-news-extractor-test:${EXTRACTOR_TEST_VERSION}"
          container_id="$(docker compose --env-file /dev/null -f docker-compose.extractor-test.yml ps -q extractor)"
          test -n "$container_id"
          container_image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
          image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
          test "$container_image_id" = "$image_id"

          artifact_dir=artifacts/extractor-candidate-image
          mkdir -p "$artifact_dir"
          archive="$artifact_dir/evening-news-extractor-image.tar"
          docker save --output "$archive" "$image_ref"
          IMAGE_REF="$image_ref" IMAGE_ID="$image_id" SOURCE_SHA="$EXTRACTOR_TEST_VERSION" ARCHIVE="$archive" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          image_id = os.environ['IMAGE_ID']
          source_sha = os.environ['SOURCE_SHA']
          archive = Path(os.environ['ARCHIVE'])
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', image_id):
              raise SystemExit('candidate_image_id_invalid')
          if not re.fullmatch(r'[0-9a-f]{40}', source_sha):
              raise SystemExit('candidate_source_sha_invalid')
          digest = hashlib.sha256()
          with archive.open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(block)
          metadata = {
              'artifact_type': 'ci_test_only_candidate',
              'image_ref': os.environ['IMAGE_REF'],
              'image_id': image_id,
              'source_sha': source_sha,
              'archive': archive.name,
              'archive_sha256': digest.hexdigest(),
          }
          (archive.parent / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: extractor-candidate-image
          path: artifacts/extractor-candidate-image/
          retention-days: 2
      - name: Inspect isolated service on failure
        if: failure()
        run: docker compose --env-file /dev/null -f docker-compose.extractor-test.yml logs --tail 80
      - name: Remove isolated service
        if: always()
        run: docker compose --env-file /dev/null -f docker-compose.extractor-test.yml down

  publish:
    needs: [verify, native-cloak-concurrency]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish independent SHA-tagged image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: ./go
          file: ./docker/Dockerfile.extractor
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dzarlax-ai/rss-extractor:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=extractor-service
          cache-to: type=gha,mode=max,scope=extractor-service
      - name: Record exact release digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'ghcr.io/dzarlax-ai/rss-extractor@%s\n' "$IMAGE_DIGEST" > extractor-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: extractor-image-reference
          path: extractor-image.txt

  native-cloak-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate binaries for the isolated native gate
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C go -o /tmp/concurrency-extract-service ./cmd/extract-service
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C go -o /tmp/concurrency-extract-egress ./cmd/extract-egress
      - name: Fetch test runtime images without publishing candidates
        run: |
          docker pull --platform linux/amd64 cloakhq/cloakbrowser:0.5.2@sha256:2c0d257802f54c4f86c9ccae336864baf63e118612732127cb96df35756a57a4
          docker pull --platform linux/amd64 python:3.12-alpine
          docker pull --platform linux/amd64 alpine:3.21
      - name: Compare one and two Cloak tabs with an independent CDP peer
        run: |
          native_gate_status=0
          sudo env "PATH=$PATH" python scripts/native_cloak_concurrency_gate.py --worker-binary /tmp/concurrency-extract-service --egress-binary /tmp/concurrency-extract-egress --output artifacts/native-cloak-concurrency.json || native_gate_status=$?
          if [ -f artifacts/native-cloak-concurrency.json ]; then
            sudo chown "$(id -u):$(id -g)" artifacts/native-cloak-concurrency.json
          fi
          exit "$native_gate_status"
      - name: Preserve native concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cloak-concurrency-evidence
          path: artifacts/native-cloak-concurrency.json
          if-no-files-found: warn
