name: Core images and full-stack acceptance

on:
  pull_request:
    paths:
      - 'db/**'
      - 'docker/**'
      - 'docker-bake.hcl'
      - 'docker-compose.example.yml'
      - 'docker-compose.dev.yml'
      - 'Makefile'
      - 'go-background/**'
      - 'go-execution/**'
      - 'go-editorial/**'
      - 'go/**'
      - 'go-ingestion/**'
      - 'go-processing/**'
      - 'go-scheduler/**'
      - 'go-worker/**'
      - 'go-web/**'
      - 'news_aggregator/**'
      - 'docs/core-image-build-and-release.md'
      - 'docs/web-api-components.md'
      - 'README.md'
      - '.env.example'
      - 'deploy/news/**'
      - 'requirements*.txt'
      - 'scripts/check_core_image_inventory.py'
      - 'scripts/prepare_runtime_env.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'scripts/core_image_release.py'
      - 'scripts/run_go_background_fixture_gate.py'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/docker-build-push.yml'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'docker/**'
      - 'docker-bake.hcl'
      - 'docker-compose.example.yml'
      - 'docker-compose.dev.yml'
      - 'Makefile'
      - 'go-background/**'
      - 'go-execution/**'
      - 'go-editorial/**'
      - 'go/**'
      - 'go-ingestion/**'
      - 'go-processing/**'
      - 'go-scheduler/**'
      - 'go-worker/**'
      - 'go-web/**'
      - 'news_aggregator/**'
      - 'docs/core-image-build-and-release.md'
      - 'docs/web-api-components.md'
      - 'README.md'
      - '.env.example'
      - 'deploy/news/**'
      - 'requirements*.txt'
      - 'scripts/check_core_image_inventory.py'
      - 'scripts/prepare_runtime_env.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'scripts/core_image_release.py'
      - 'scripts/run_go_background_fixture_gate.py'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all three tested core images from reviewed main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: evening_news_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d evening_news_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-editorial/go.mod
          cache-dependency-path: go-editorial/go.*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: Build private editorial CLI for fake-provider integration tests
        working-directory: go-editorial
        run: go build -o "$RUNNER_TEMP/news-editorial" ./cmd/news-editorial
      - name: Run complete Python suite
        env:
          CI: 'true'
          NO_BROWSER: '1'
          TEST_DATABASE_URL: postgresql+asyncpg://fixture_admin:fixture-only@127.0.0.1:5432/evening_news_test
          DATABASE_URL: postgresql+asyncpg://fixture_admin:fixture-only@127.0.0.1:5432/evening_news_test
          GEMINI_API_KEY: ''
          TELEGRAM_TOKEN: ''
          TELEGRAPH_ACCESS_TOKEN: ''
          BROWSER_WS_ENDPOINT: ''
          SCHEDULER_ENABLED: 'false'
          NEWS_EDITORIAL_BINARY: ${{ runner.temp }}/news-editorial
          NEWS_EDITORIAL_INTEGRATION_REQUIRED: '1'
        run: python -m pytest tests/ -q

  go-core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
        module: [go-worker, go-scheduler, go-ingestion, go-processing, go-execution, go-background, go-editorial]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: go_core_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fixture_admin -d go_core_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - name: Race tests, vet, and module verification
        working-directory: ${{ matrix.module }}
        env:
          TEST_DATABASE_URL: postgres://fixture_admin:fixture-only@127.0.0.1:5432/go_core_tests
          SCHEDULER_TEST_DATABASE_URL: postgres://fixture_admin:fixture-only@127.0.0.1:5432/go_core_tests
        run: |
          go mod verify
          go test -race -count=1 ./...
          go vet ./...

  assemble-fixture:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') }}
    needs: [python-tests, go-core-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - name: Install isolated fixture dependencies
        run: python -m pip install -r requirements.txt
      - name: Preload consolidated fixture infrastructure images
        run: docker pull postgres:17-alpine && docker pull python:3.12-alpine
      - name: Build all three core runtime targets
        env:
          REVISION: ${{ github.sha }}
          PLATFORM: linux/amd64
        run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64' --load
      - name: Check target contents
        run: python3 scripts/check_core_image_inventory.py
      - name: Build unchanged extractor fixture
        run: docker build --platform linux/amd64 -f docker/Dockerfile.extractor -t evening-news-collector:consolidation-fixture go
      - name: Run consolidated synthetic acceptance
        run: >-
          python scripts/run_go_background_fixture_gate.py
          --web-image evening-news-web:consolidation-fixture
          --background-image evening-news-background:consolidation-fixture
          --executor-image evening-news-executor:consolidation-fixture
          --collector-image evening-news-collector:consolidation-fixture
          --output-dir artifacts/go-background-fixture
      - name: Upload sanitized fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-images-consolidated-fixture
          path: artifacts/go-background-fixture/
          if-no-files-found: ignore

  publish-reviewed-main:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    needs: [python-tests, go-core-tests]
    concurrency:
      group: core-image-publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - name: Install isolated fixture dependencies
        run: python -m pip install -r requirements.txt
      - name: Preload consolidated fixture infrastructure images
        run: docker pull postgres:17-alpine && docker pull python:3.12-alpine
      - name: Build the candidate images for the acceptance gate
        env:
          REVISION: ${{ github.sha }}
          PLATFORM: linux/amd64
        run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64' --load
      - name: Check candidate target contents
        run: python3 scripts/check_core_image_inventory.py
      - name: Build unchanged extractor fixture
        run: docker build --platform linux/amd64 -f docker/Dockerfile.extractor -t evening-news-collector:consolidation-fixture go
      - name: Run consolidated synthetic acceptance on the release candidates
        run: >-
          python scripts/run_go_background_fixture_gate.py
          --web-image evening-news-web:consolidation-fixture
          --background-image evening-news-background:consolidation-fixture
          --executor-image evening-news-executor:consolidation-fixture
          --collector-image evening-news-collector:consolidation-fixture
          --output-dir artifacts/go-background-fixture
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite any existing core image SHA tag
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for repository in rss-web rss-background rss-summarizer; do
            GHCR_REPOSITORY="dzarlax-ai/${repository}" \
              IMAGE_TAG="ghcr.io/dzarlax-ai/${repository}:sha-${GITHUB_SHA}" \
              python3 scripts/check_ghcr_tag_absent.py
          done
      - name: Publish the accepted local image contents and record manifest
        run: >-
          python3 scripts/core_image_release.py
          --revision "${GITHUB_SHA}"
          --platform linux/amd64
          --output artifacts/release-images.json
          --acceptance-dir artifacts/go-background-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ github.sha }}
          path: artifacts/release-images.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-core-fixture-${{ github.sha }}
          path: artifacts/go-background-fixture/
          if-no-files-found: ignore
