name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'news_aggregator/**'
      - 'web/**'
      - 'docker/**'
      - 'db/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'tests/**'
      - 'scripts/run_background_worker_fixture_gate.py'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    paths:
      - 'news_aggregator/**'
      - 'web/**'
      - 'docker/**'
      - 'db/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'tests/**'
      - 'scripts/run_background_worker_fixture_gate.py'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dzarlax-ai/rss-summarizer

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: evening_news_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evening_news_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up JavaScript behavior test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        env:
          CI: 'true'
          NO_BROWSER: '1'
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-only@127.0.0.1:5432/evening_news_test
          DATABASE_URL: postgresql+asyncpg://postgres:test-only@127.0.0.1:5432/evening_news_test
          GEMINI_API_KEY: ''
          TELEGRAM_TOKEN: ''
          TELEGRAPH_ACCESS_TOKEN: ''
          BROWSER_WS_ENDPOINT: ''
          SCHEDULER_ENABLED: 'false'
        run: python -m pytest tests/ -q

  background-worker-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local fixture application image
        run: docker build -f docker/Dockerfile -t evening-news-background-worker:fixture .
      - name: Run isolated web and worker acceptance
        run: >-
          python scripts/run_background_worker_fixture_gate.py
          --image evening-news-background-worker:fixture
          --output-dir artifacts/background-worker-fixture
      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-worker-fixture
          path: artifacts/background-worker-fixture/
          if-no-files-found: ignore

  build-and-push:
    needs: [test, background-worker-fixture]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: false
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ github.sha }}

      - name: Test Docker image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} python -c "import news_aggregator; print('✅ Import test passed')"
