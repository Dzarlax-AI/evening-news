name: Core images and full-stack acceptance

on:
  pull_request:
    paths:
      - 'db/**'
      - 'docker/**'
      - 'docker-bake.hcl'
      - 'docker-compose.managed.yml'
      - 'deploy/config/development.env.example'
      - 'deploy/config/full.env.example'
      - 'docs/configuration.md'
      - 'deploy/recovery/**'
      - 'deploy/compose/development.yml'
      - 'deploy/compose/development.override.yml'
      - 'Makefile'
      - 'go-background/**'
      - 'go-execution/**'
      - 'go-editorial/**'
      - 'go-domain/**'
      - 'go-tools/**'
      - 'go/**'
      - 'go-ingestion/**'
      - 'go-processing/**'
      - 'go-scheduler/**'
      - 'go-worker/**'
      - 'go-web/**'
      - 'docs/core-image-build-and-release.md'
      - 'docs/ai-runtime.md'
      - 'docs/article-analysis.md'
      - 'docs/DOCKER_README.md'
      - 'docs/web-api-components.md'
      - 'README.md'
      - '.env.example'
      - 'deploy/news/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/docker-build-push.yml'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'docker/**'
      - 'docker-bake.hcl'
      - 'docker-compose.managed.yml'
      - 'deploy/config/development.env.example'
      - 'deploy/config/full.env.example'
      - 'docs/configuration.md'
      - 'deploy/recovery/**'
      - 'deploy/compose/development.yml'
      - 'deploy/compose/development.override.yml'
      - 'Makefile'
      - 'go-background/**'
      - 'go-execution/**'
      - 'go-editorial/**'
      - 'go-domain/**'
      - 'go-tools/**'
      - 'go/**'
      - 'go-ingestion/**'
      - 'go-processing/**'
      - 'go-scheduler/**'
      - 'go-worker/**'
      - 'go-web/**'
      - 'docs/core-image-build-and-release.md'
      - 'docs/ai-runtime.md'
      - 'docs/article-analysis.md'
      - 'docs/DOCKER_README.md'
      - 'docs/web-api-components.md'
      - 'README.md'
      - '.env.example'
      - 'deploy/news/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all three tested core images from reviewed main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  go-core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
        module: [go, go-web, go-worker, go-scheduler, go-ingestion, go-processing, go-execution, go-background, go-editorial, go-domain, go-tools]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: go_core_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fixture_admin -d go_core_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - uses: actions/setup-node@v4
        if: matrix.module == 'go-web'
        with:
          node-version: '22'
      - name: Build TypeScript browser assets
        if: matrix.module == 'go-web'
        run: |
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web run build
      - name: Race tests, vet, and module verification
        working-directory: ${{ matrix.module }}
        env:
          TEST_DATABASE_URL: postgres://fixture_admin:fixture-only@127.0.0.1:5432/go_core_tests
          SCHEDULER_TEST_DATABASE_URL: postgres://fixture_admin:fixture-only@127.0.0.1:5432/go_core_tests
        run: |
          go mod verify
          if [ '${{ matrix.module }}' = 'go-domain' ]; then
            go test -race -count=1 -p=1 ./...
          else
            go test -race -count=1 ./...
          fi
          go vet ./...

  managed-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: news_fixture
        options: >-
          --health-cmd "pg_isready -U postgres -d news_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Build isolated installer tests
        working-directory: go-domain
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o "$RUNNER_TEMP/news-installer.test" ./cmd/newsctl
      - name: Check fresh roles and encrypted restore with matching PostgreSQL client
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -eu
          trap 'rm -f "$RUNNER_TEMP/news-installer.test"' EXIT
          docker cp "$RUNNER_TEMP/news-installer.test" "$PG_CONTAINER:/tmp/news-installer.test"
          docker exec "$PG_CONTAINER" mkdir -p "$GITHUB_WORKSPACE/go-scheduler/migrations"
          docker cp go-scheduler/migrations/001_initial.sql "$PG_CONTAINER:$GITHUB_WORKSPACE/go-scheduler/migrations/001_initial.sql"
          docker exec -e NEWS_INSTALLER_TEST_RECOVERY=1 -e 'NEWS_INSTALLER_TEST_DATABASE_URL=postgres://postgres:fixture-only@127.0.0.1:5432/news_fixture?sslmode=disable' "$PG_CONTAINER" /tmp/news-installer.test -test.run '^Test(FreshProvision|AdoptionImportPostgresFixture|ExternalInstallPostgresFixture)$' -test.count=1 -test.timeout=5m

      - name: Build settings-recovery rehearsal and standard age tools
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -eu
          (cd go-domain && go test -c -o "$RUNNER_TEMP/news-settings-recovery.test" ./recovery)
          (cd go-scheduler && go test -c -o "$RUNNER_TEMP/news-settings-schedules.test" ./internal/api)
          GOBIN="$RUNNER_TEMP/news-settings-tools" go install filippo.io/age/cmd/age@v1.3.2
          GOBIN="$RUNNER_TEMP/news-settings-tools" go install filippo.io/age/cmd/age-keygen@v1.3.2
      - name: Rehearse settings-only encrypted recovery without external calls
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -eu
          trap 'rm -f "$RUNNER_TEMP/news-settings-recovery.test" "$RUNNER_TEMP/news-settings-schedules.test"; rm -rf "$RUNNER_TEMP/news-settings-tools"' EXIT
          docker exec "$PG_CONTAINER" createdb -U postgres settings_recovery_fixture
          docker exec "$PG_CONTAINER" mkdir -p "$GITHUB_WORKSPACE/deploy" "$GITHUB_WORKSPACE/go-domain/recovery" "$GITHUB_WORKSPACE/go-scheduler/internal/api" "$GITHUB_WORKSPACE/docs"
          docker cp deploy/recovery "$PG_CONTAINER:$GITHUB_WORKSPACE/deploy/"
          docker cp docs/managed-settings-recovery.md "$PG_CONTAINER:$GITHUB_WORKSPACE/docs/managed-settings-recovery.md"
          docker cp "$RUNNER_TEMP/news-settings-recovery.test" "$PG_CONTAINER:/tmp/news-settings-recovery.test"
          docker cp "$RUNNER_TEMP/news-settings-schedules.test" "$PG_CONTAINER:/tmp/news-settings-schedules.test"
          docker cp "$RUNNER_TEMP/news-settings-tools/age" "$PG_CONTAINER:/tmp/age"
          docker cp "$RUNNER_TEMP/news-settings-tools/age-keygen" "$PG_CONTAINER:/tmp/age-keygen"
          for spec in 'go-domain/recovery:news-settings-recovery:TestSettingsRecoveryRecipes' 'go-scheduler/internal/api:news-settings-schedules:TestSettingsRecoverySchedulesNoReplay'; do
            work=${spec%%:*}; rest=${spec#*:}; binary=${rest%%:*}; test_name=${rest#*:}
            docker exec -w "$GITHUB_WORKSPACE/$work" -e PATH=/tmp:/usr/local/bin:/usr/bin:/bin -e 'NEWS_SETTINGS_RECOVERY_TEST_URL=postgres://postgres:fixture-only@127.0.0.1:5432/settings_recovery_fixture?sslmode=disable' "$PG_CONTAINER" "/tmp/$binary.test" -test.run "^$test_name$" -test.count=1 -test.timeout=5m
          done

  cross-build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build core images for Linux ARM64 without publication
        env:
          REVISION: ${{ github.sha }}
          PLATFORM: linux/arm64
        run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/arm64' --set '*.output=type=cacheonly'

  assemble-fixture:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') }}
    needs: [go-core-tests, cross-build-arm64, managed-recovery]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Build fixture gate
        working-directory: go-tools
        run: |
          go build -o "$RUNNER_TEMP/news-vertical-fixture-gate" ./cmd/vertical-fixture-gate
          go build -o "$RUNNER_TEMP/news-managed-adoption-gate" ./cmd/managed-adoption-gate
      - name: Pull isolated fixture infrastructure
        run: docker pull postgres:${{ matrix.postgres }}-alpine && docker pull alpine:3.21
      - name: Build all three candidate core images
        env:
          REVISION: ${{ github.sha }}
          PLATFORM: linux/amd64
        run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64' --load
      - name: Check image contents and identity
        working-directory: go-tools
        run: go run ./cmd/check-core-image-inventory
      - name: Build unchanged extractor fixture
        run: docker build --platform linux/amd64 -f docker/Dockerfile.extractor -t evening-news-collector:consolidation-fixture go
      - name: Run isolated image acceptance
        env:
          NEWS_FIXTURE_PG_MAJOR: ${{ matrix.postgres }}
        run: >-
          "$RUNNER_TEMP/news-vertical-fixture-gate" --output-dir "artifacts/acceptance-${NEWS_FIXTURE_PG_MAJOR}"
      - name: Run isolated legacy adoption acceptance
        run: >-
          "$RUNNER_TEMP/news-managed-adoption-gate"
          --postgres-major "${{ matrix.postgres }}"
          --output-dir "artifacts/managed-adoption-${{ matrix.postgres }}"
      - name: Remove fixture gate binaries
        if: always()
        run: rm -f "$RUNNER_TEMP/news-vertical-fixture-gate" "$RUNNER_TEMP/news-managed-adoption-gate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-image-acceptance-pg${{ matrix.postgres }}
          path: |
            artifacts/acceptance-${{ matrix.postgres }}/
            artifacts/managed-adoption-${{ matrix.postgres }}/
          if-no-files-found: ignore

  publish-reviewed-main:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    needs: [go-core-tests, cross-build-arm64, managed-recovery]
    concurrency:
      group: core-image-publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Build fixture gate
        working-directory: go-tools
        run: |
          go build -o "$RUNNER_TEMP/news-vertical-fixture-gate" ./cmd/vertical-fixture-gate
          go build -o "$RUNNER_TEMP/news-managed-adoption-gate" ./cmd/managed-adoption-gate
      - name: Pull isolated fixture infrastructure
        run: docker pull postgres:16-alpine && docker pull postgres:17-alpine && docker pull alpine:3.21
      - name: Build candidate images once
        env:
          REVISION: ${{ github.sha }}
          PLATFORM: linux/amd64
        run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64' --load
      - name: Check candidate target contents
        working-directory: go-tools
        run: go run ./cmd/check-core-image-inventory
      - name: Build unchanged extractor fixture
        run: docker build --platform linux/amd64 -f docker/Dockerfile.extractor -t evening-news-collector:consolidation-fixture go
      - name: Run isolated acceptance on PostgreSQL 16 and 17
        run: |
          set -eu
          trap 'rm -f "$RUNNER_TEMP/news-vertical-fixture-gate" "$RUNNER_TEMP/news-managed-adoption-gate"' EXIT
          NEWS_FIXTURE_PG_MAJOR=16 "$RUNNER_TEMP/news-vertical-fixture-gate" --output-dir artifacts/acceptance-16
          NEWS_FIXTURE_PG_MAJOR=17 "$RUNNER_TEMP/news-vertical-fixture-gate" --output-dir artifacts/acceptance-17
          cmp artifacts/acceptance-16/receipt.json artifacts/acceptance-17/receipt.json
          "$RUNNER_TEMP/news-managed-adoption-gate" --postgres-major 16 --output-dir artifacts/managed-adoption-16
          "$RUNNER_TEMP/news-managed-adoption-gate" --postgres-major 17 --output-dir artifacts/managed-adoption-17
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing immutable SHA tags
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: go-tools
        run: |
          set -euo pipefail
          for repository in rss-web rss-background rss-summarizer; do
            GHCR_REPOSITORY="dzarlax-ai/${repository}" \
              IMAGE_TAG="ghcr.io/dzarlax-ai/${repository}:sha-${GITHUB_SHA}" \
              go run ./cmd/check-ghcr-tag-absent
          done
      - name: Publish the accepted local images and record manifest
        working-directory: go-tools
        run: >-
          go run ./cmd/core-image-release
          --revision "${GITHUB_SHA}"
          --platform linux/amd64
          --output ../artifacts/release-images.json
          --acceptance-dir ../artifacts/acceptance-17
      - uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ github.sha }}
          path: artifacts/release-images.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-core-fixture-${{ github.sha }}
          path: |
            artifacts/acceptance-*/
            artifacts/managed-adoption-*/
          if-no-files-found: ignore
