name: Core images and full-stack acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only changed, fully accepted core images from main
        type: boolean
        default: false
      full_integration:
        description: Run the separate complete integration gate
        type: boolean
        default: false
      bootstrap_fixture:
        description: Explicitly build a missing extractor fixture artifact once
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Serialize the entire exact-SHA candidate lifecycle, including simultaneous
# merge and dispatch. Publication across different SHAs has its own lock below.
concurrency:
  group: core-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      head_sha: ${{ steps.select.outputs.head_sha }}
      modules: ${{ steps.select.outputs.modules }}
      targets: ${{ steps.select.outputs.targets }}
      fixture_targets: ${{ steps.select.outputs.fixture_targets }}
      candidate_required: ${{ steps.select.outputs.candidate_required }}
      reuse_candidate: ${{ steps.select.outputs.reuse_candidate }}
      integration_required: ${{ steps.select.outputs.integration_required }}
    env:
      NEWS_CI_TOOLS: /tmp/news-ci-tools
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EVENT_NAME: ${{ github.event_name }}
      FULL_INTEGRATION: ${{ inputs.full_integration || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - name: Build selection and artifact tools
        working-directory: go-tools
        run: |
          mkdir -p "$NEWS_CI_TOOLS"
          for command in ci-impact ci-artifacts; do
            go build -o "$NEWS_CI_TOOLS/$command" "./cmd/$command"
          done
      - name: Resolve trusted baseline and select affected checks
        id: select
        run: |
          flags=()
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            flags+=(--pr --base "$base")
          fi
          if [ "$FULL_INTEGRATION" = true ]; then flags+=(--full); fi
          python3 scripts/ci-core.py plan --root "$GITHUB_WORKSPACE" --head "$HEAD_SHA" --output "$RUNNER_TEMP/core-plan" "${flags[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: core-impact-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/core-plan/
          if-no-files-found: error
          retention-days: 30

  go-core-tests:
    needs: impact
    if: ${{ needs.impact.outputs.modules != '[]' && needs.impact.outputs.reuse_candidate != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
        module: ${{ fromJSON(needs.impact.outputs.modules) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: go_core_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fixture_admin -d go_core_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.impact.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - uses: actions/setup-node@v4
        if: matrix.module == 'go-web'
        with:
          node-version: '22'
      - name: Build TypeScript assets required by web tests
        if: matrix.module == 'go-web'
        run: |
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web run typecheck
          npm --prefix web run build
      - name: Race tests, vet and dependency verification for selected module
        working-directory: ${{ matrix.module }}
        env:
          TEST_DATABASE_URL: postgres://fixture_admin:fixture-only@127.0.0.1:5432/go_core_tests
          SCHEDULER_TEST_DATABASE_URL: postgres://fixture_admin:fixture-only@127.0.0.1:5432/go_core_tests
          SELECTED_MODULE: ${{ matrix.module }}
        run: |
          go mod verify
          if [ "$SELECTED_MODULE" = go-domain ]; then
            go test -race -count=1 -p=1 ./...
          else
            go test -race -count=1 ./...
          fi
          go vet ./...
      - name: Check CI orchestration without external effects
        if: matrix.module == 'go-tools'
        working-directory: .
        run: python3 -m unittest discover -s scripts -p 'test_ci_*.py'

  cross-build-arm64:
    needs: impact
    if: ${{ needs.impact.outputs.targets != '[]' && needs.impact.outputs.reuse_candidate != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REVISION: ${{ needs.impact.outputs.head_sha }}
      TARGETS_JSON: ${{ needs.impact.outputs.targets }}
      PLATFORM: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.impact.outputs.head_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compile only selected targets for ARM64
        run: |
          python3 - <<'PYTHON'
          import json,os,subprocess
          targets=json.loads(os.environ['TARGETS_JSON'])
          assert targets and len(targets)==len(set(targets)) and set(targets)<=set(['web','background','executor'])
          subprocess.run(['docker','buildx','bake','-f','docker-bake.hcl','--set','*.platform=linux/arm64','--set','*.output=type=cacheonly',*targets],check=True)
          PYTHON

  core-checks:
    name: Core checks
    if: always()
    needs: [impact, go-core-tests, cross-build-arm64]
    runs-on: ubuntu-latest
    env:
      PLAN_RESULT: ${{ needs.impact.result }}
      MODULES: ${{ needs.impact.outputs.modules }}
      TARGETS: ${{ needs.impact.outputs.targets }}
      REUSED: ${{ needs.impact.outputs.reuse_candidate }}
      TEST_RESULT: ${{ needs.go-core-tests.result }}
      ARM_RESULT: ${{ needs.cross-build-arm64.result }}
    steps:
      - name: Reject failure or unexpected skipped checks
        run: |
          python3 - <<'PYTHON'
          import json,os
          assert os.environ['PLAN_RESULT']=='success'
          if os.environ['REUSED']!='true':
            assert not json.loads(os.environ['MODULES']) or os.environ['TEST_RESULT']=='success'
            assert not json.loads(os.environ['TARGETS']) or os.environ['ARM_RESULT']=='success'
          print('Selected checks completed; empty selections and verified reuse are explicit.')
          PYTHON

  candidate:
    needs: [impact, core-checks]
    if: ${{ needs.core-checks.result == 'success' && needs.impact.outputs.candidate_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      candidate_run_id: ${{ steps.prepare.outputs.candidate_run_id }}
      candidate_artifact: ${{ steps.prepare.outputs.candidate_artifact }}
      catalog_key: ${{ steps.prepare.outputs.catalog_key }}
    env:
      NEWS_CI_TOOLS: /tmp/news-ci-tools
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ needs.impact.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build trusted metadata tools
        working-directory: go-tools
        run: |
          mkdir -p "$NEWS_CI_TOOLS"
          for command in ci-impact ci-artifacts core-image-catalog; do
            go build -o "$NEWS_CI_TOOLS/$command" "./cmd/$command"
          done
      - uses: actions/download-artifact@v4
        with:
          name: core-impact-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/core-plan/
      - name: Build selected images once or reuse the exact successful candidate
        id: prepare
        run: python3 scripts/ci-core.py candidate --root "$GITHUB_WORKSPACE" --head "$HEAD_SHA" --plan "$RUNNER_TEMP/core-plan" --output "$RUNNER_TEMP/core-candidate"
      - name: Save exact candidate images and catalog
        uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.reused != 'true'
        with:
          name: core-candidate-${{ env.HEAD_SHA }}
          compression-level: 0
          path: ${{ runner.temp }}/core-candidate/
          if-no-files-found: error
          retention-days: 30

  gate-reuse:
    needs: [impact, candidate]
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
      gate_run_id: ${{ steps.find.outputs.gate_run_id }}
      gate_artifact: ${{ steps.find.outputs.gate_artifact }}
    env:
      NEWS_CI_TOOLS: /tmp/news-ci-tools
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ needs.impact.outputs.head_sha }}
      CATALOG_KEY: ${{ needs.candidate.outputs.catalog_key }}
      IS_PR: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - name: Build artifact verifier
        working-directory: go-tools
        run: |
          mkdir -p "$NEWS_CI_TOOLS"
          go build -o "$NEWS_CI_TOOLS/ci-artifacts" ./cmd/ci-artifacts
      - id: find
        name: Locate an already successful gate for this exact catalog
        run: |
          flags=()
          if [ "$IS_PR" = true ]; then flags+=(--pr); fi
          python3 scripts/ci-core.py lookup-gate --root "$GITHUB_WORKSPACE" --head "$HEAD_SHA" --key "$CATALOG_KEY" "${flags[@]}"

  full-integration:
    needs: [impact, candidate, gate-reuse]
    if: ${{ needs.gate-reuse.outputs.found != 'true' && (inputs.publish || inputs.full_integration || needs.impact.outputs.integration_required == 'true') }}
    uses: ./.github/workflows/core-integration.yml
    permissions:
      contents: read
      actions: read
      packages: read
    with:
      head_sha: ${{ needs.impact.outputs.head_sha }}
      candidate_run_id: ${{ needs.candidate.outputs.candidate_run_id }}
      candidate_artifact: ${{ needs.candidate.outputs.candidate_artifact }}
      catalog_key: ${{ needs.candidate.outputs.catalog_key }}
      is_pr: ${{ github.event_name == 'pull_request' }}
      bootstrap_fixture: ${{ inputs.bootstrap_fixture || false }}

  publish-reviewed-main:
    needs: [impact, core-checks, candidate, gate-reuse, full-integration]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && needs.impact.result == 'success' && needs.core-checks.result == 'success' && needs.candidate.result == 'success' && needs.impact.outputs.targets != '[]' && (needs.gate-reuse.outputs.found == 'true' || needs.full-integration.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    # This lock spans DIFFERENT SHAs. Baseline is remotely re-read by the
    # publisher before first push and before manifest emission inside the lock.
    concurrency:
      group: core-image-publication
      cancel-in-progress: false
    env:
      NEWS_CI_TOOLS: /tmp/news-ci-tools
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ needs.impact.outputs.head_sha }}
      CANDIDATE_RUN_ID: ${{ needs.candidate.outputs.candidate_run_id }}
      CANDIDATE_NAME: ${{ needs.candidate.outputs.candidate_artifact }}
      CATALOG_KEY: ${{ needs.candidate.outputs.catalog_key }}
      GATE_RUN_ID: ${{ needs.gate-reuse.outputs.gate_run_id || needs.full-integration.outputs.gate_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build verified publication tools
        working-directory: go-tools
        run: |
          mkdir -p "$NEWS_CI_TOOLS"
          for command in ci-impact ci-artifacts core-image-catalog core-image-release; do
            go build -o "$NEWS_CI_TOOLS/$command" "./cmd/$command"
          done
      - name: Restore accepted contents and publish selected targets without rebuilding
        run: python3 scripts/ci-core.py publish --root "$GITHUB_WORKSPACE" --head "$HEAD_SHA" --run-id "$CANDIDATE_RUN_ID" --name "$CANDIDATE_NAME" --key "$CATALOG_KEY" --gate-run-id "$GATE_RUN_ID" --output "$RUNNER_TEMP/core-publication"
      - uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/core-publication/release-images.json
          if-no-files-found: error
          retention-days: 90
