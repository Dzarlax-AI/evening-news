name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'news_aggregator/**'
      - 'web/**'
      - 'docker/**'
      - 'go-worker/**'
      - 'db/**'
      - 'docker-compose.example.yml'
      - 'docker-compose.dev.yml'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'tests/**'
      - 'scripts/run_background_worker_fixture_gate.py'
      - 'scripts/run_go_job_worker_fixture_gate.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'tests/test_ghcr_tag_guard.py'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    paths:
      - 'news_aggregator/**'
      - 'web/**'
      - 'docker/**'
      - 'go-worker/**'
      - 'db/**'
      - 'docker-compose.example.yml'
      - 'docker-compose.dev.yml'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'tests/**'
      - 'scripts/run_background_worker_fixture_gate.py'
      - 'scripts/run_go_job_worker_fixture_gate.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'tests/test_ghcr_tag_guard.py'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dzarlax-ai/rss-summarizer

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: evening_news_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evening_news_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up JavaScript behavior test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        env:
          CI: 'true'
          NO_BROWSER: '1'
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-only@127.0.0.1:5432/evening_news_test
          DATABASE_URL: postgresql+asyncpg://postgres:test-only@127.0.0.1:5432/evening_news_test
          GEMINI_API_KEY: ''
          TELEGRAM_TOKEN: ''
          TELEGRAPH_ACCESS_TOKEN: ''
          BROWSER_WS_ENDPOINT: ''
          SCHEDULER_ENABLED: 'false'
        run: python -m pytest tests/ -q

  go-worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: worker_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fixture_admin -d worker_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-worker/go.mod
          cache-dependency-path: go-worker/go.sum
      - name: Run Go race tests
        working-directory: go-worker
        env:
          TEST_DATABASE_URL: postgres://fixture_admin:fixture-only@127.0.0.1:5432/worker_tests
        run: go test -race ./...
      - name: Vet Go worker
        working-directory: go-worker
        run: go vet ./...

  background-worker-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local fixture application image
        run: docker build -f docker/Dockerfile -t evening-news-job-app:fixture .
      - name: Build local Go job worker image
        run: docker build -f go-worker/Dockerfile -t evening-news-job-worker:fixture .
      - name: Run isolated Go worker and Python executor acceptance
        run: >-
          python scripts/run_go_job_worker_fixture_gate.py
          --image evening-news-job-app:fixture
          --worker-image evening-news-job-worker:fixture
          --output-dir artifacts/go-job-worker-fixture
      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-job-worker-fixture
          path: artifacts/go-job-worker-fixture/
          if-no-files-found: ignore

  build-and-push:
    needs: [test, go-worker-tests, background-worker-fixture]
    concurrency:
      group: news-app-worker-publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing Go worker SHA tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ghcr.io/dzarlax-ai/rss-job-worker:sha-${{ github.sha }}
          GHCR_REPOSITORY: dzarlax-ai/rss-job-worker
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_ghcr_tag_absent.py

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: false
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ github.sha }}

      - name: Build and publish Go job worker image
        id: go_worker_image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./go-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dzarlax-ai/rss-job-worker:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Evening News Go job worker
          cache-from: type=gha,scope=go-job-worker
          cache-to: type=gha,mode=max,scope=go-job-worker

      - name: Record exact published Go worker digest
        id: go_worker_digest
        if: steps.go_worker_image.outcome == 'success'
        env:
          IMAGE_DIGEST: ${{ steps.go_worker_image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          IMAGE_REF="ghcr.io/dzarlax-ai/rss-job-worker@${IMAGE_DIGEST}"
          printf '%s\n' "$IMAGE_REF" > job-worker-image.txt
          printf 'image_ref=%s\n' "$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Save Go worker image digest evidence
        if: steps.go_worker_image.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: go-job-worker-image
          path: job-worker-image.txt
          retention-days: 14

      - name: Test Docker image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} python -c "import news_aggregator; print('✅ Import test passed')"
