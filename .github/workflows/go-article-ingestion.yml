name: Go article ingestion

on:
  pull_request:
    paths:
      - 'go-ingestion/**'
      - 'go-domain/**'
      - 'go-processing/**'
      - 'go/**'
      - 'go-worker/**'
      - 'web/**'
      - 'docker/Dockerfile'
      - 'docker/Dockerfile.extractor'
      - 'deploy/news-ingestion/**'
      - 'tests/fixtures/go-ingestion/**'
      - '.github/workflows/go-article-ingestion.yml'
  push:
    branches: [main]
    paths:
      - 'go-ingestion/**'
      - 'go-domain/**'
      - 'go-processing/**'
      - 'go/**'
      - 'go-worker/**'
      - 'web/**'
      - 'docker/Dockerfile'
      - 'docker/Dockerfile.extractor'
      - 'deploy/news-ingestion/**'
      - 'tests/fixtures/go-ingestion/**'
      - '.github/workflows/go-article-ingestion.yml'
permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      check_ingestion: ${{ steps.select.outputs.check_ingestion }}
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - name: Select impacted checks
        id: select
        run: scripts/ci-impact.sh

  module-and-migration:
    needs: impact
    if: ${{ always() && (needs.impact.result != 'success' || needs.impact.outputs.check_ingestion == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: ingestion_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fixture_admin -d ingestion_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture_admin:fixture-only@127.0.0.1:5432/ingestion_tests
      DATABASE_URL: postgresql+asyncpg://fixture_admin:fixture-only@127.0.0.1:5432/ingestion_tests
      ADMIN_USERNAME: fixture-admin
      ADMIN_PASSWORD: fixture-admin-password
      JWT_SECRET: fixture-only-jwt-signing-value
      GEMINI_API_KEY: fixture-only-gemini-key
      GEMINI_API_ENDPOINT: http://127.0.0.1:9/v1/models
      TELEGRAM_TOKEN: fixture-only-telegram-token
      TELEGRAM_CHAT_ID: fixture-only-chat-id
      SCHEDULER_ENABLED: 'false'
      ARTICLE_PROCESSING_URL: http://processing.invalid:8094
      ARTICLE_PROCESSING_TOKEN: isolated-article-processing-token
      ARTICLE_AI_TOKEN: isolated-article-ai-token
      ARTICLE_INGESTION_MODE: go
      ARTICLE_INGESTION_URL: http://ingestion.invalid:8093
      ARTICLE_INGESTION_TOKEN: isolated-article-ingestion-token
      BACKGROUND_EXECUTION_MODE: worker
    steps:
      - name: Fail if impact selection failed
        if: ${{ needs.impact.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-ingestion/go.mod
          cache-dependency-path: go-ingestion/go.sum
      - name: Verify module dependencies and build supported Linux architectures
        working-directory: go-ingestion
        run: |
          go mod verify
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/news-ingestion-linux-amd64 ./cmd/news-ingestion
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/news-ingestion-linux-arm64 ./cmd/news-ingestion
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-domain/go.mod
          cache-dependency-path: go-domain/go.sum
      - name: Native ingestion callback and migration checks
        if: ${{ !contains(fromJSON(needs.impact.outputs.modules), 'go-domain') }}
        working-directory: go-domain
        run: |
          go test -race -count=1 -p=1 ./selectors ./learning ./migration
          go vet ./selectors ./learning ./migration
