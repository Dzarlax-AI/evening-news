name: Go article ingestion

on:
  pull_request:
    paths:
      - 'go-ingestion/**'
      - 'go/**'
      - 'go-worker/**'
      - 'news_aggregator/**'
      - 'web/**'
      - 'docker/Dockerfile'
      - 'docker/Dockerfile.extractor'
      - 'deploy/news-ingestion/**'
      - 'scripts/run_go_ingestion_fixture_gate.py'
      - 'tests/fixtures/go-ingestion/**'
      - 'tests/test_go_ingestion_fixture_gate.py'
      - 'tests/test_article_ingestion*'
      - '.github/workflows/go-article-ingestion.yml'
  push:
    branches: [main]
    paths:
      - 'go-ingestion/**'
      - 'go/**'
      - 'go-worker/**'
      - 'news_aggregator/**'
      - 'web/**'
      - 'docker/Dockerfile'
      - 'docker/Dockerfile.extractor'
      - 'deploy/news-ingestion/**'
      - 'scripts/run_go_ingestion_fixture_gate.py'
      - 'tests/fixtures/go-ingestion/**'
      - 'tests/test_go_ingestion_fixture_gate.py'
      - 'tests/test_article_ingestion*'
      - '.github/workflows/go-article-ingestion.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Go article-ingestion image from main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  module-and-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: ingestion_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fixture_admin -d ingestion_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture_admin:fixture-only@127.0.0.1:5432/ingestion_tests
      DATABASE_URL: postgresql+asyncpg://fixture_admin:fixture-only@127.0.0.1:5432/ingestion_tests
      ADMIN_USERNAME: fixture-admin
      ADMIN_PASSWORD: fixture-admin-password
      JWT_SECRET: fixture-only-jwt-signing-value
      GEMINI_API_KEY: fixture-only-gemini-key
      GEMINI_API_ENDPOINT: http://127.0.0.1:9/v1/models
      TELEGRAM_TOKEN: fixture-only-telegram-token
      TELEGRAM_CHAT_ID: fixture-only-chat-id
      SCHEDULER_ENABLED: 'false'
      ARTICLE_INGESTION_MODE: go
      ARTICLE_INGESTION_URL: http://ingestion.invalid:8093
      ARTICLE_INGESTION_TOKEN: isolated-article-ingestion-token
      BACKGROUND_EXECUTION_MODE: worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-ingestion/go.mod
          cache-dependency-path: go-ingestion/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Go unit, PostgreSQL, race, and static checks
        working-directory: go-ingestion
        run: |
          go mod verify
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/news-ingestion-linux-amd64 ./cmd/news-ingestion
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/news-ingestion-linux-arm64 ./cmd/news-ingestion
      - name: Python client, migration, callback, and privilege checks
        run: python -m pytest -q tests/test_article_ingestion*.py tests/test_go_ingestion_fixture_gate.py

  isolated-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-ingestion/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Pull isolated fixture runtime images
        run: |
          docker pull postgres:17-alpine
          docker pull python:3.12-alpine
      - name: Build local fixture images
        run: |
          docker build -f docker/Dockerfile -t evening-news-ingestion-app:fixture .
          docker build -f docker/Dockerfile.extractor -t evening-news-collector:fixture go
          docker build -f go-worker/Dockerfile -t evening-news-job-worker:fixture .
          docker build --platform linux/amd64 -f go-ingestion/Dockerfile -t evening-news-ingestion:fixture .
      - name: Run isolated synthetic ingestion acceptance
        run: >-
          python scripts/run_go_ingestion_fixture_gate.py
          --app-image evening-news-ingestion-app:fixture
          --worker-image evening-news-job-worker:fixture
          --collector-image evening-news-collector:fixture
          --ingestion-image evening-news-ingestion:fixture
          --output-dir artifacts/go-ingestion-fixture
      - name: Save sanitized fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-article-ingestion-fixture
          path: artifacts/go-ingestion-fixture/
          if-no-files-found: ignore

  publish:
    needs: [module-and-migration, isolated-fixture]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    concurrency:
      group: go-article-ingestion-publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing SHA tag
        env:
          IMAGE_TAG: ghcr.io/dzarlax-ai/rss-article-ingestion:sha-${{ github.sha }}
          GHCR_REPOSITORY: dzarlax-ai/rss-article-ingestion
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_ghcr_tag_absent.py
      - name: Publish verified Go article-ingestion image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./go-ingestion/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dzarlax-ai/rss-article-ingestion:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Evening News Go article ingestion
          cache-from: type=gha,scope=go-article-ingestion
          cache-to: type=gha,mode=max,scope=go-article-ingestion
      - name: Record exact published image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'ghcr.io/dzarlax-ai/rss-article-ingestion@%s\n' "$IMAGE_DIGEST" > ingestion-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: go-article-ingestion-image
          path: ingestion-image.txt
          retention-days: 14
