name: Web API components

on:
  pull_request:
    paths:
      - 'go-web/**'
      - 'news_aggregator/**'
      - 'web/**'
      - 'tests/fixtures/web-contract-v1/**'
      - 'tests/test_web_backend_api.py'
      - 'tests/test_migration_bootstrap.py'
      - 'tests/test_go_web_fixture_gate.py'
      - 'tests/test_ghcr_tag_guard.py'
      - 'tests/fixtures/go-web/**'
      - 'scripts/run_go_web_fixture_gate.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'tests/fixtures/go-ingestion/**'
      - 'tests/fixtures/go-source-manager/**'
      - 'tests/fixtures/go-scheduler/**'
      - 'requirements.txt'
      - '.github/workflows/web-api.yml'
  push:
    branches: [main]
    paths:
      - 'go-web/**'
      - 'news_aggregator/**'
      - 'web/**'
      - 'tests/fixtures/web-contract-v1/**'
      - 'tests/test_web_backend_api.py'
      - 'tests/test_migration_bootstrap.py'
      - 'tests/test_go_web_fixture_gate.py'
      - 'tests/test_ghcr_tag_guard.py'
      - 'tests/fixtures/go-web/**'
      - 'scripts/run_go_web_fixture_gate.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'tests/fixtures/go-ingestion/**'
      - 'tests/fixtures/go-source-manager/**'
      - 'tests/fixtures/go-scheduler/**'
      - 'requirements.txt'
      - '.github/workflows/web-api.yml'
permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: webtests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d webtests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture_admin:fixture-only@127.0.0.1:5432/webtests
      DATABASE_URL: postgresql+asyncpg://fixture_admin:fixture-only@127.0.0.1:5432/webtests
      GEMINI_API_KEY: fixture-only
      GEMINI_API_ENDPOINT: http://127.0.0.1:9/v1/models
      ADMIN_PASSWORD: fixture-admin-password
      JWT_SECRET: fixture-only-signing-key-at-least-thirty-two-bytes
      SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-web/go.mod
          cache-dependency-path: go-web/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify admin digest dates against UTC near local midnight
        working-directory: go-web
        run: TZ=Pacific/Kiritimati node --test test/summaries_date.test.cjs
      - run: python -m pip install -r requirements.txt
      - name: Verify private backend and migration contracts
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://fixture_admin:fixture-only@127.0.0.1:5432/webtests
        run: python -m pytest tests/test_web_backend_api.py tests/test_migration_bootstrap.py tests/test_go_web_fixture_gate.py tests/test_ghcr_tag_guard.py -q
      - name: Go component checks
        working-directory: go-web
        run: |
          go mod verify
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/news-web-amd64 ./cmd/news-web
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/news-web-arm64 ./cmd/news-web
