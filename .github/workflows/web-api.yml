name: Web API components

on:
  pull_request:
    paths:
      - 'go-web/**'
      - 'news_aggregator/**'
      - 'web/**'
      - 'tests/fixtures/web-contract-v1/**'
      - 'tests/test_web_backend_api.py'
      - 'tests/test_migration_bootstrap.py'
      - 'tests/test_go_web_fixture_gate.py'
      - 'tests/test_ghcr_tag_guard.py'
      - 'tests/fixtures/go-web/**'
      - 'scripts/run_go_web_fixture_gate.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'tests/fixtures/go-ingestion/**'
      - 'tests/fixtures/go-source-manager/**'
      - 'tests/fixtures/go-scheduler/**'
      - 'requirements.txt'
      - '.github/workflows/web-api.yml'
  push:
    branches: [main]
    paths:
      - 'go-web/**'
      - 'news_aggregator/**'
      - 'web/**'
      - 'tests/fixtures/web-contract-v1/**'
      - 'tests/test_web_backend_api.py'
      - 'tests/test_migration_bootstrap.py'
      - 'tests/test_go_web_fixture_gate.py'
      - 'tests/test_ghcr_tag_guard.py'
      - 'tests/fixtures/go-web/**'
      - 'scripts/run_go_web_fixture_gate.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'tests/fixtures/go-ingestion/**'
      - 'tests/fixtures/go-source-manager/**'
      - 'tests/fixtures/go-scheduler/**'
      - 'requirements.txt'
      - '.github/workflows/web-api.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Go web image from reviewed main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: webtests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d webtests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture_admin:fixture-only@127.0.0.1:5432/webtests
      DATABASE_URL: postgresql+asyncpg://fixture_admin:fixture-only@127.0.0.1:5432/webtests
      GEMINI_API_KEY: fixture-only
      GEMINI_API_ENDPOINT: http://127.0.0.1:9/v1/models
      ADMIN_PASSWORD: fixture-admin-password
      JWT_SECRET: fixture-only-signing-key-at-least-thirty-two-bytes
      SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-web/go.mod
          cache-dependency-path: go-web/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify private backend and migration contracts
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://fixture_admin:fixture-only@127.0.0.1:5432/webtests
        run: python -m pytest tests/test_web_backend_api.py tests/test_migration_bootstrap.py tests/test_go_web_fixture_gate.py tests/test_ghcr_tag_guard.py -q
      - name: Go component checks
        working-directory: go-web
        run: |
          go mod verify
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/news-web-amd64 ./cmd/news-web
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/news-web-arm64 ./cmd/news-web
      - name: Build the candidate web image without publication
        if: matrix.postgres == '17'
        run: docker build -f go-web/Dockerfile -t evening-news-web:fixture .

  full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-web/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated local fixture images
        run: |
          docker pull postgres:17-alpine
          docker pull python:3.12-alpine
          docker build -f go-web/Dockerfile -t evening-news-web:components-20261026 .
          docker build -f docker/Dockerfile -t evening-news-web-app:components-20261026 .
          docker build -f go-worker/Dockerfile -t evening-news-job-worker:web-components-20261026 .
          docker build -f docker/Dockerfile.extractor -t evening-news-collector:web-components-20261026 go
          docker build -f go-ingestion/Dockerfile -t evening-news-ingestion:web-components-20261026 .
          docker build -f go-processing/Dockerfile -t evening-news-processing:web-components-20261026 .
      - name: Run isolated Go web full-pipeline fixture gate
        run: python scripts/run_go_web_fixture_gate.py --output artifacts/go-web-full-pipeline
      - name: Save sanitized acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-web-full-pipeline-report
          path: artifacts/go-web-full-pipeline/report.json
          if-no-files-found: ignore

  publish:
    needs: [contracts, full-pipeline]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    concurrency:
      group: go-web-publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing SHA tag
        env:
          IMAGE_TAG: ghcr.io/dzarlax-ai/rss-web:sha-${{ github.sha }}
          GHCR_REPOSITORY: dzarlax-ai/rss-web
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_ghcr_tag_absent.py
      - name: Publish verified Go web image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./go-web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dzarlax-ai/rss-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Evening News Go web
          cache-from: type=gha,scope=go-web
          cache-to: type=gha,mode=max,scope=go-web
      - name: Record exact published image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf 'ghcr.io/dzarlax-ai/rss-web@%s\n' "$IMAGE_DIGEST" > web-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: go-web-image
          path: web-image.txt
          retention-days: 14
