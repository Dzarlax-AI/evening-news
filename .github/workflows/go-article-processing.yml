name: Go article processing

on:
  pull_request:
    paths:
      - 'go-processing/**'
      - 'go-domain/**'
      - 'tests/**'
      - 'deploy/news-processing/**'
      - 'docker-compose*.yml'
      - '.github/workflows/go-article-processing.yml'
  push:
    branches: [main]
    paths:
      - 'go-processing/**'
      - 'go-domain/**'
      - 'tests/**'
      - 'deploy/news-processing/**'
      - '.github/workflows/go-article-processing.yml'
permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      check_processing: ${{ steps.select.outputs.check_processing }}
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - name: Select impacted checks
        id: select
        run: scripts/ci-impact.sh

  processing:
    needs: impact
    if: ${{ always() && (needs.impact.result != 'success' || needs.impact.outputs.check_processing == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: processing_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fixture_admin -d processing_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture_admin:fixture-only@127.0.0.1:5432/processing_tests
      DATABASE_URL: postgresql+asyncpg://fixture_admin:fixture-only@127.0.0.1:5432/processing_tests
      ADMIN_PASSWORD: fixture-admin-password
      JWT_SECRET: fixture-only-jwt-signing-value
      GEMINI_API_KEY: fixture-only-gemini-key
      GEMINI_API_ENDPOINT: http://127.0.0.1:9/v1/models
      SCHEDULER_ENABLED: 'false'
      BACKGROUND_EXECUTION_MODE: worker
      ARTICLE_PROCESSING_URL: http://processing.invalid:8094
      ARTICLE_PROCESSING_TOKEN: fixture-only-processing-token
      ARTICLE_AI_TOKEN: fixture-only-ai-token
    steps:
      - name: Fail if impact selection failed
        if: ${{ needs.impact.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-processing/go.mod
          cache-dependency-path: go-processing/go.sum
      - name: Verify module dependencies and build supported Linux architectures
        working-directory: go-processing
        run: |
          go mod verify
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/news-processing-amd64 ./cmd/news-processing
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/news-processing-arm64 ./cmd/news-processing
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-domain/go.mod
          cache-dependency-path: go-domain/go.sum
      - name: Native callback, migration and role-boundary checks
        if: ${{ !contains(fromJSON(needs.impact.outputs.modules), 'go-domain') }}
        working-directory: go-domain
        run: |
          go test -race -count=1 -p=1 ./callbacks ./migration ./learning
          go vet ./callbacks ./migration ./learning
