name: Standalone Go scheduler

on:
  push:
    branches: [main]
    paths:
      - 'go-scheduler/**'
      - 'go-worker/**'
      - 'go-processing/**'
      - 'news_aggregator/**'
      - 'web/**'
      - 'tests/**'
      - 'docker/**'
      - 'scripts/run_go_scheduler_fixture_gate.py'
      - 'scripts/run_background_worker_fixture_gate.py'
      - 'scripts/scheduler_bridge.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'tests/test_ghcr_tag_guard.py'
      - '.github/workflows/go-scheduler.yml'
  pull_request:
    paths:
      - 'go-scheduler/**'
      - 'go-worker/**'
      - 'go-processing/**'
      - 'news_aggregator/**'
      - 'web/**'
      - 'tests/**'
      - 'docker/**'
      - 'scripts/run_go_scheduler_fixture_gate.py'
      - 'scripts/run_background_worker_fixture_gate.py'
      - 'scripts/scheduler_bridge.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'tests/test_ghcr_tag_guard.py'
      - '.github/workflows/go-scheduler.yml'
permissions:
  contents: read

jobs:
  scheduler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: scheduler_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fixture_admin -d scheduler_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed GHCR SHA tag guard
        run: python3 tests/test_ghcr_tag_guard.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-scheduler/go.mod
          cache-dependency-path: go-scheduler/go.sum
      - name: Unit, race, PostgreSQL, and static checks
        working-directory: go-scheduler
        env:
          SCHEDULER_TEST_DATABASE_URL: postgres://fixture_admin:fixture-only@127.0.0.1:5432/scheduler_tests
        run: |
          go test -race ./...
          go vet ./...
      - name: Compile Linux amd64 and macOS ARM64
        working-directory: go-scheduler
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/scheduler-linux-amd64 ./cmd/scheduler
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/scheduler-darwin-arm64 ./cmd/scheduler
