name: Standalone Go scheduler

on:
  push:
    branches: [main]
    paths:
      - 'go-scheduler/**'
      - 'go-tools/**'
      - 'go-worker/**'
      - 'go-processing/**'
      - 'web/**'
      - 'tests/**'
      - 'docker/**'
      - '.github/workflows/go-scheduler.yml'
  pull_request:
    paths:
      - 'go-scheduler/**'
      - 'go-tools/**'
      - 'go-worker/**'
      - 'go-processing/**'
      - 'web/**'
      - 'tests/**'
      - 'docker/**'
      - '.github/workflows/go-scheduler.yml'
permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      check_scheduler: ${{ steps.select.outputs.check_scheduler }}
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-tools/go.mod
          cache-dependency-path: go-tools/go.sum
      - name: Select impacted checks
        id: select
        run: scripts/ci-impact.sh

  scheduler-tests:
    needs: impact
    if: ${{ always() && (needs.impact.result != 'success' || needs.impact.outputs.check_scheduler == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail if impact selection failed
        if: ${{ needs.impact.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-scheduler/go.mod
          cache-dependency-path: go-scheduler/go.sum
      - name: Test fail-closed GHCR SHA tag guard
        if: ${{ !contains(fromJSON(needs.impact.outputs.modules), 'go-tools') }}
        working-directory: go-tools
        run: go test -race ./registryguard ./cmd/check-ghcr-tag-absent
      - name: Compile Linux amd64 and macOS ARM64
        working-directory: go-scheduler
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/scheduler-linux-amd64 ./cmd/scheduler
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/scheduler-darwin-arm64 ./cmd/scheduler
