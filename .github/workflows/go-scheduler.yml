name: Standalone Go scheduler

on:
  push:
    branches: [main]
    paths:
      - 'go-scheduler/**'
      - 'go-worker/**'
      - 'go-processing/**'
      - 'news_aggregator/**'
      - 'web/**'
      - 'tests/**'
      - 'docker/**'
      - 'scripts/run_go_scheduler_fixture_gate.py'
      - 'scripts/run_background_worker_fixture_gate.py'
      - 'scripts/scheduler_bridge.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'tests/test_ghcr_tag_guard.py'
      - '.github/workflows/go-scheduler.yml'
  pull_request:
    paths:
      - 'go-scheduler/**'
      - 'go-worker/**'
      - 'go-processing/**'
      - 'news_aggregator/**'
      - 'web/**'
      - 'tests/**'
      - 'docker/**'
      - 'scripts/run_go_scheduler_fixture_gate.py'
      - 'scripts/run_background_worker_fixture_gate.py'
      - 'scripts/scheduler_bridge.py'
      - 'scripts/check_ghcr_tag_absent.py'
      - 'tests/test_ghcr_tag_guard.py'
      - '.github/workflows/go-scheduler.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the standalone scheduler image from main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scheduler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: scheduler_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fixture_admin -d scheduler_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed GHCR SHA tag guard
        run: python3 tests/test_ghcr_tag_guard.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-scheduler/go.mod
          cache-dependency-path: go-scheduler/go.sum
      - name: Unit, race, PostgreSQL, and static checks
        working-directory: go-scheduler
        env:
          SCHEDULER_TEST_DATABASE_URL: postgres://fixture_admin:fixture-only@127.0.0.1:5432/scheduler_tests
        run: |
          go test -race ./...
          go vet ./...
      - name: Compile Linux amd64 and macOS ARM64
        working-directory: go-scheduler
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/scheduler-linux-amd64 ./cmd/scheduler
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/scheduler-darwin-arm64 ./cmd/scheduler

  scheduler-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local application fixture image
        run: docker build -f docker/Dockerfile -t evening-news-scheduler-app:fixture .
      - name: Build local Go web fixture image
        run: docker build -f go-web/Dockerfile -t evening-news-web:fixture .
      - name: Build local scheduler fixture image
        run: |
          SCHEDULER_FIXTURE_BUILD_ID=$(python -c "import runpy; ns=runpy.run_path('scripts/run_go_scheduler_fixture_gate.py'); print(ns['DockerGate'].scheduler_source_hash(None))")
          docker build --build-arg SCHEDULER_BUILD_ID="$SCHEDULER_FIXTURE_BUILD_ID" -t evening-news-scheduler:fixture go-scheduler
      - name: Build local Go job worker fixture image
        run: docker build -f go-worker/Dockerfile -t evening-news-job-worker:fixture .
      - name: Build local Go article processing fixture image
        run: docker build -f go-processing/Dockerfile -t evening-news-article-processing:fixture .
      - name: Fetch isolated PostgreSQL fixture image
        run: docker pull postgres:16-alpine
      - name: Verify isolated service integration
        run: >-
          python scripts/run_go_scheduler_fixture_gate.py
          --app-image evening-news-scheduler-app:fixture
          --web-image evening-news-web:fixture
          --scheduler-image evening-news-scheduler:fixture
          --worker-image evening-news-job-worker:fixture
          --processing-image evening-news-article-processing:fixture
          --output-dir artifacts/go-scheduler-fixture
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-go-scheduler-fixture
          path: artifacts/go-scheduler-fixture/
          if-no-files-found: ignore

  publish:
    needs: [scheduler-tests, scheduler-fixture]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    concurrency:
      group: go-scheduler-publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute fixture-matched scheduler source hash
        id: source
        run: |
          set -euo pipefail
          scheduler_hash="$(python -c "import runpy; ns=runpy.run_path('scripts/run_go_scheduler_fixture_gate.py'); print(ns['DockerGate'].scheduler_source_hash(None))")"
          echo "scheduler_build_id=$scheduler_hash" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing SHA tag
        env:
          IMAGE_TAG: ghcr.io/dzarlax-ai/rss-scheduler:sha-${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_ghcr_tag_absent.py
      - name: Publish verified standalone scheduler image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: ./go-scheduler
          file: ./go-scheduler/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dzarlax-ai/rss-scheduler:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Evening News standalone scheduler
          build-args: |
            SCHEDULER_BUILD_ID=${{ steps.source.outputs.scheduler_build_id }}
          cache-from: type=gha,scope=go-scheduler
          cache-to: type=gha,mode=max,scope=go-scheduler
      - name: Record exact published scheduler digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'ghcr.io/dzarlax-ai/rss-scheduler@%s\n' "$IMAGE_DIGEST" > scheduler-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-go-scheduler-image
          path: scheduler-image.txt
          retention-days: 14
