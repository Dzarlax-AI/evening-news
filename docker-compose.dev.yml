# Development overlay. Start the complete local service stack with:
# docker compose -f docker-compose.example.yml -f docker-compose.dev.yml up --build
services:
  web:
    environment:
      LOG_LEVEL: DEBUG
      DEVELOPMENT: "true"
      MAX_WORKERS: "2"
      NEWS_LIMIT_ENABLED: "true"
      NEWS_LIMIT_MAX_ARTICLES: "2"
      NEWS_LIMIT_PER_SOURCE: "2"
    volumes:
      - ./news_aggregator:/app/news_aggregator:ro
      - ./web:/app/web:ro

  executor:
    environment:
      LOG_LEVEL: DEBUG
      DEVELOPMENT: "true"
      MAX_WORKERS: "2"
      NEWS_LIMIT_ENABLED: "true"
      NEWS_LIMIT_MAX_ARTICLES: "2"
      NEWS_LIMIT_PER_SOURCE: "2"
    volumes:
      - ./news_aggregator:/app/news_aggregator:ro
      - ./web:/app/web:ro

  article-processing:
    environment:
      MAX_WORKERS: "2"
      NEWS_LIMIT_ENABLED: "true"
      NEWS_LIMIT_MAX_ARTICLES: "2"
      NEWS_LIMIT_PER_SOURCE: "2"
