{{define "page-title"}}Сюжеты{{end}}
{{define "content"}}
<header class="admin-page-header">
    <h1>Сюжеты</h1>
    <div id="topics-status" class="topics-status" role="status">Загрузка…</div>
</header>
<form id="topics-filter" class="topics-filter">
    <div class="topics-search">
        <label for="topics-query">Поиск по сюжетам</label>
        <input id="topics-query" maxlength="200" type="search" class="admin-input">
    </div>
    <div>
        <label for="topics-state">Состояние сюжета</label>
        <select id="topics-state" class="admin-input">
            <option value="">Все сюжеты</option>
            <option value="active">Активные</option>
            <option value="dormant">Затихшие</option>
            <option value="candidate">Кандидаты</option>
            <option value="review">На проверке</option>
        </select>
    </div>
    <button type="submit" class="btn btn--primary">Найти</button>
</form>
<div class="topics-layout">
    <section aria-label="Список сюжетов">
        <div id="topics-list" class="topics-list" aria-live="polite"></div>
        <div class="topics-pagination">
            <button id="topics-prev" class="btn btn--secondary" type="button" disabled>Назад</button>
            <button id="topics-next" class="btn btn--secondary" type="button" disabled>Далее</button>
        </div>
    </section>
    <section id="topics-detail" class="topics-detail card" aria-label="Детали сюжета" aria-live="polite">
        <p class="topics-empty">Выберите сюжет.</p>
    </section>
</div>
{{end}}
{{define "admin-extra-js"}}<script src="/static/js/admin-topics.js" defer></script>{{end}}
