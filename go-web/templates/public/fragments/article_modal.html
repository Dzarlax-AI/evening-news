<!-- Article Modal -->
<div id="articleModal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
        <div class="modal-header">
            <button class="modal-close" aria-label="Закрыть" onclick="closeArticleModal()">&times;</button>
        </div>

        <!-- Shared reader content -->
        {{READER_CONTENT}}
        <div class="modal-body">
            <div class="modal-actions">
                <button id="modalRefreshBtn" class="btn btn--warning" onclick="refreshArticle()" style="display: none;" title="Обновить статью (только для админов)">
                    🔄 Обновить статью
                </button>
                <button id="modalOriginalBtn" class="btn btn--primary" onclick="window.open('', '_blank')" style="display: none;">
                    🔗 Читать оригинал
                </button>
                <button class="btn btn--secondary" onclick="closeArticleModal()">
                    Закрыть
                </button>
                <button id="adminAccessBtn" class="btn-admin-access" onclick="toggleAdminAccess()" title="Вход в админ-режим">
                    🔐
                </button>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="/static/css/article-reader.css">
<script src="/static/js/article-reader.js" defer></script>

<script>
// Current article ID for admin operations
let currentArticleId = null;
let requestGeneration = 0;
let previousFocus = null;
let previousOverflow = "";
let refreshTimer = null;
let refreshAttemptGeneration = null;
const refreshIdleHTML = document.getElementById('modalRefreshBtn').innerHTML;

function resetRefreshControl() {
    if (refreshTimer !== null) clearTimeout(refreshTimer);
    refreshTimer = null;
    refreshAttemptGeneration = null;
    const button = document.getElementById('modalRefreshBtn');
    button.disabled = false;
    button.innerHTML = refreshIdleHTML;
}

// Article modal functions
window.openArticleModal = async function(articleId) {
    const modal = document.getElementById('articleModal');
    if (!modal) return;

    const request = ++requestGeneration;
    resetRefreshControl();
    if (modal.style.display === 'none') {
        previousFocus = document.activeElement;
        previousOverflow = document.body.style.overflow;
    }
    // Store current article ID for admin operations
    currentArticleId = articleId;

    // Show modal with loading state
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    modal.querySelector('.modal-close').focus();

    window.articleReader.reset();
    // Reset content
    document.getElementById('modalTitle').textContent = 'Загрузка...';
    document.getElementById('modalSource').textContent = 'Загрузка...';
    document.getElementById('modalDate').textContent = 'Загрузка...';
    document.getElementById('modalSummary').style.display = '';
    document.getElementById('modalSummary').innerHTML = '<div class="loading-spinner"></div><p>Загрузка содержимого...</p>';
    document.getElementById('modalContentSpoiler').style.display = 'none';
    document.getElementById('modalGallery').style.display = 'none';
    document.getElementById('modalAdBadge').style.display = 'none';
    document.getElementById('modalAdReasoning').style.display = 'none';
    document.getElementById('modalAdMarkers').style.display = 'none';
    document.getElementById('modalFinalCategories').style.display = 'none';
    document.getElementById('modalOriginalCategories').style.display = 'none';
    document.getElementById('modalOriginalBtn').style.display = 'none';
    document.getElementById('modalRefreshBtn').style.display = 'none';

    try {
        const response = await fetch(`/api/public/article/${articleId}?v=${Date.now()}`);

        if (!response.ok) {
            throw new Error(`Server returned ${response.status}`);
        }

        const article = await window.readApiResponse(response);
        if (request !== requestGeneration) return;


        window.articleReader.render(article);

        // Set up the source link only for safe HTTP(S) URLs.
        const originalBtn = document.getElementById('modalOriginalBtn');
        const originalURL = window.articleReader.safeURL(article.url);
        if (originalURL) {
            originalBtn.onclick = () => window.open(originalURL, '_blank', 'noopener,noreferrer');
            originalBtn.style.display = 'inline-flex';
        }

        // Initialize admin access indicator
        updateAdminAccessIndicator();

    } catch (error) {
        if (request !== requestGeneration) return;
        console.error('Произошла ошибка при загрузке статьи:', error);
        document.getElementById('modalSummary').innerHTML = `
            <div style="color: #d32f2f; text-align: center;">
                <p><strong>❌ Ошибка загрузки статьи:</strong></p>
                <p style="font-size: 0.9rem; margin-top: 10px;">${escapeHtml(window.presentError(error))}</p>
            </div>
        `;
    }
};

window.closeArticleModal = function() {
    const modal = document.getElementById('articleModal');
    if (modal && modal.style.display !== 'none') {
        ++requestGeneration;
        resetRefreshControl();
        modal.style.display = 'none';
        document.body.style.overflow = previousOverflow;
        if (previousFocus && previousFocus.isConnected) previousFocus.focus();
        previousFocus = null;

        // Reset fullscreen if active
        window.articleReader.reset();


        // Reset admin state
        currentArticleId = null;
    }
};

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Keyboard navigation
document.addEventListener('keydown', function(e) {
    const modal = document.getElementById('articleModal');
    if (!modal || modal.style.display === 'none') return;

    if (e.key === 'Escape') {
        if (document.fullscreenElement) return;
        e.preventDefault(); closeArticleModal();
    } else if (e.key === 'Tab') {
        const items = Array.from(modal.querySelectorAll('button, a[href], summary, audio[controls], video[controls], [tabindex]:not([tabindex="-1"])')).filter(el => !el.disabled && el.getClientRects().length);
        if (!items.length) return;
        const first = items[0], last = items[items.length - 1];
        if (e.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && (document.activeElement === last || !modal.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
    }

});

// Close modal on overlay click
document.addEventListener('click', function(e) {
    const modal = document.getElementById('articleModal');
    if (e.target === modal) {
        closeArticleModal();
    }
});

// Admin functionality
function showAdminButton() {
    const refreshBtn = document.getElementById('modalRefreshBtn');
    if (refreshBtn) {
        refreshBtn.style.display = 'inline-flex';
    }
}

function updateAdminAccessIndicator() {
    const adminBtn = document.getElementById('adminAccessBtn');
    if (!adminBtn) return;

    if (window.adminAccessVerified === true) {
        adminBtn.classList.add('admin-verified');
        adminBtn.innerHTML = '🔓';
        adminBtn.title = 'Админ-режим активен';
        showAdminButton();
    } else {
        adminBtn.classList.remove('admin-verified');
        adminBtn.innerHTML = '🔐';
        adminBtn.title = 'Вход в админ-режим';
        const refreshBtn = document.getElementById('modalRefreshBtn');
        if (refreshBtn) {
            refreshBtn.style.display = 'none';
        }
    }
}

window.toggleAdminAccess = async function() {
    if (window.adminAccessVerified === true) {
        window.location.href = window.localizedURL('/admin/');
        return;
    }
    // Not logged in — redirect to admin (Authentik will handle login)
    window.location.href = window.localizedURL('/admin/');
};

async function checkAdminAccess() {
    if (window.adminAccessVerified === true) {
        showAdminButton();
        return;
    }

    try {
        const response = await fetch('/api/public/admin-check', {
            credentials: 'include',
            cache: 'no-cache'
        });

        if (response.ok) {
            const data = await window.readApiResponse(response);
            if (data.admin) {
                window.adminAccessVerified = true;
                showAdminButton();
                updateAdminAccessIndicator();
            }
        }
    } catch (error) {
        console.log('Admin check failed:', window.presentError(error));
    }
}

// Auto-check admin access on page load
checkAdminAccess();

window.refreshArticle = async function() {
    if (!currentArticleId) {
        alert('Ошибка: ID статьи не найден');
        return;
    }

    if (window.adminAccessVerified === false) {
        updateAdminAccessIndicator();
        alert('Обновление статьи доступно только после входа в админ-режим');
        window.location.href = window.localizedURL('/admin/');
        return;
    }

    const refreshedArticleId = currentArticleId;
    const refreshGeneration = requestGeneration;
    const refreshBtn = document.getElementById('modalRefreshBtn');
    const isCurrent = () => requestGeneration === refreshGeneration
        && currentArticleId === refreshedArticleId
        && document.getElementById('articleModal').style.display !== 'none';
    if (!refreshBtn || refreshAttemptGeneration === refreshGeneration) return;
    refreshAttemptGeneration = refreshGeneration;
    refreshBtn.disabled = true;
    refreshBtn.innerHTML = '⏳ Обновляем...';
    const originalText = refreshIdleHTML;

    try {
        const adminResponse = await fetch('/api/public/admin-check', {
            credentials: 'include',
            cache: 'no-cache'
        });
        const adminData = adminResponse.ok ? await adminResponse.json() : { admin: false };
        if (!isCurrent()) return;
        if (!adminData.admin) {
            window.adminAccessVerified = false;
            updateAdminAccessIndicator();
            alert('Админ-сессия не активна. Сначала войдите в админ-режим.');
            window.location.href = window.localizedURL('/admin/');
            return;
        }
    } catch (error) {
        if (!isCurrent()) return;
        window.adminAccessVerified = false;
        updateAdminAccessIndicator();
        alert('Не удалось проверить админ-доступ. Сначала войдите в админ-режим.');
        window.location.href = window.localizedURL('/admin/');
        return;
    }

    if (!isCurrent()) return;

    try {
        // Disable button and show loading
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = '⏳ Обновляем...';


        // Call reprocess API with content refetch
        const response = await fetch(`/api/public/article/${refreshedArticleId}/reprocess`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',  // Include cookies for auth
            body: JSON.stringify({
                force: true,
                refetch_content: true
            })
        });

        const data = await window.readApiResponse(response);
        if (!isCurrent()) return;
        if (!response.ok) throw new Error(data.detail || `Ошибка ${response.status}`);
        const result = await window.resolveBackgroundResponse(response, data, job => {
            if (!isCurrent()) return;
            refreshBtn.innerHTML = job.status === 'queued'
                ? (job.worker_available === false ? '⏳ В очереди, обработчик недоступен' : '⏳ В очереди...')
                : job.status === 'interrupted' ? '⏸️ Ожидает восстановления...' : '⏳ Обрабатываем...';
        });
        if (!isCurrent()) return;

        let shouldRefreshArticle = false;
        if (result.status === 'delivery_unknown') {
            refreshBtn.innerHTML = '⚠️ Результат неизвестен';
            alert('Результат операции неизвестен. Повторная обработка не запускалась автоматически.');
        } else if (result.status === 'interrupted') {
            refreshBtn.innerHTML = '⏸️ Прервано';
            alert('Задание прервано и сохранено для восстановления.');
        } else {
            const details = result.result || result.stats || result;
            const outcome = (details.article_outcomes || [])[0];
            const articleState = outcome?.state || details.status || result.status;
            const articleReason = outcome?.reason || details.reason || result.reason;
            if (articleState === 'rejected') {
                refreshBtn.innerHTML = articleReason === 'advertisement' ? '🚫 Реклама' : '⛔ Обработка остановлена';
                alert(articleReason === 'resource_limit'
                    ? 'Страница превышает допустимый размер.'
                    : 'Статья исключена из обработки.');
                shouldRefreshArticle = true;
            } else if (articleState === 'exhausted') {
                refreshBtn.innerHTML = '⛔ Лимит попыток';
                alert('Лимит попыток обработки исчерпан.');
                shouldRefreshArticle = true;
            } else if (['pending', 'retry_wait', 'processing'].includes(articleState)) {
                refreshBtn.innerHTML = '⏳ Повтор запланирован';
                alert('Обработка временно не завершена. Повторная попытка запланирована.');
                shouldRefreshArticle = true;
            } else if (result.success === true || details.success === true
                || ['success', 'completed', 'settled'].includes(details.status)
                || articleState === 'completed') {
                refreshBtn.innerHTML = '✅ Обновлено!';
                shouldRefreshArticle = true;
            } else {
                refreshBtn.innerHTML = '⚠️ Не завершено';
                throw new Error(window.presentMessage(result.message, result.error_code) || 'Обработка статьи не завершена.');
            }
        }

        if (shouldRefreshArticle) {
            // Auto-reload the article in modal after a short delay
            refreshTimer = setTimeout(async () => {
                if (!isCurrent()) return;
                refreshBtn.innerHTML = originalText;
                refreshBtn.disabled = false;
                await window.openArticleModal(refreshedArticleId);
            }, 2000);
        }

    } catch (error) {
        if (!isCurrent()) return;
        console.error('Article refresh failed:', error);

        // Show error state
        refreshBtn.innerHTML = '❌ Ошибка';

        // Show user-friendly error message
        alert(`Не удалось обновить статью: ${window.presentError(error)}`);

        // Restore button after delay
        refreshTimer = setTimeout(() => {
            if (!isCurrent()) return;
            refreshAttemptGeneration = null;
            refreshBtn.innerHTML = originalText;
            refreshBtn.disabled = false;
        }, 3000);
    }
};
</script>
