# Temporary cutover overlay. Apply while draining the old Python scheduler,
# exporting the offline News snapshot, and importing into the paused Go service.
# Remove it before enabling service mode or restoring the pre-cutover mode.
services:
  app:
    environment:
      SCHEDULER_ENABLED: "false"
      SCHEDULE_DISPATCH_MODE: python

  worker:
    environment:
      SCHEDULER_ENABLED: "false"
      SCHEDULE_DISPATCH_MODE: python
