# Development overlay. Start the complete local service stack with:
# docker compose --project-directory . -f deploy/compose/development.yml -f deploy/compose/development.override.yml up --build
services:
  web:
    environment:
      LOG_LEVEL: DEBUG
      DEVELOPMENT: "true"
    volumes:
      - ./go-web/templates:/app/go-web/templates:ro
      # Keep the compiled locale.js from the image while live-mounting editable assets.
      - ./web/static/css:/app/web/static/css:ro
      - ./web/static/js/admin-csrf.js:/app/web/static/js/admin-csrf.js:ro
      - ./web/static/js/chart.min.js:/app/web/static/js/chart.min.js:ro
      - ./web/static/js/main.js:/app/web/static/js/main.js:ro
      - ./web/static/js/onboarding.js:/app/web/static/js/onboarding.js:ro

  executor:
    environment:
      LOG_LEVEL: DEBUG
      DEVELOPMENT: "true"
      MAX_WORKERS: "2"
      NEWS_LIMIT_ENABLED: "true"
      NEWS_LIMIT_MAX_ARTICLES: "2"
      NEWS_LIMIT_PER_SOURCE: "2"

  background:
    environment:
      MAX_WORKERS: "2"
      NEWS_LIMIT_ENABLED: "true"
      NEWS_LIMIT_MAX_ARTICLES: "2"
      NEWS_LIMIT_PER_SOURCE: "2"
