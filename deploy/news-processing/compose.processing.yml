# Deployment template only; applying it requires separate rollout approval.
services:
  article-processing:
    image: ${ARTICLE_PROCESSING_IMAGE:?Set ARTICLE_PROCESSING_IMAGE to a reviewed digest}
    environment:
      ARTICLE_PROCESSING_LISTEN: ":8094"
      ARTICLE_PROCESSING_DB_MAX_CONNS: "5"
      DATABASE_URL: ${ARTICLE_PROCESSING_DATABASE_URL:?Set restricted processing database URL}
      ARTICLE_PROCESSING_TOKEN: ${ARTICLE_PROCESSING_TOKEN:?Set ARTICLE_PROCESSING_TOKEN}
      ARTICLE_AI_URL: ${ARTICLE_AI_URL:?Set fixed private Python executor origin}
      ARTICLE_AI_TOKEN: ${ARTICLE_AI_TOKEN:?Set dedicated ARTICLE_AI_TOKEN}
      EXTRACTION_SERVICE_URL: ${EXTRACTION_SERVICE_URL:?Set EXTRACTION_SERVICE_URL}
      EXTRACTION_SERVICE_TOKEN: ${EXTRACTION_SERVICE_TOKEN:?Set EXTRACTION_SERVICE_TOKEN}
      EXTRACTION_SERVICE_NATIVE_BROWSER: ${EXTRACTION_SERVICE_NATIVE_BROWSER:-false}
      MAX_WORKERS: ${MAX_WORKERS:-5}
      PROCESSING_BATCH_SIZE: ${PROCESSING_BATCH_SIZE:-25}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
      PROCESSING_RETRY_INITIAL_SECONDS: ${PROCESSING_RETRY_INITIAL_SECONDS:-1800}
      PROCESSING_RETRY_LATER_SECONDS: ${PROCESSING_RETRY_LATER_SECONDS:-21600}
      PROCESSING_ATTEMPT_TIMEOUT_SECONDS: ${PROCESSING_ATTEMPT_TIMEOUT_SECONDS:-600}
      EXTRACTION_HTTP_MAX_BYTES: ${EXTRACTION_HTTP_MAX_BYTES:-5242880}
      EXTRACTION_BROWSER_MAX_BYTES: ${EXTRACTION_BROWSER_MAX_BYTES:-5242880}
      EXTRACTION_TEXT_MAX_CHARS: ${EXTRACTION_TEXT_MAX_CHARS:-100000}
      EXTRACTION_SERVICE_TIMEOUT_SECONDS: ${EXTRACTION_SERVICE_TIMEOUT_SECONDS:-30}
      EXTRACTION_SERVICE_TOTAL_BUDGET_SECONDS: ${EXTRACTION_SERVICE_TOTAL_BUDGET_SECONDS:-120}
      NEWS_LIMIT_ENABLED: ${NEWS_LIMIT_ENABLED:-false}
      NEWS_LIMIT_DAYS: ${NEWS_LIMIT_DAYS:-1}
      NEWS_LIMIT_MAX_ARTICLES: ${NEWS_LIMIT_MAX_ARTICLES:-50}
      NEWS_LIMIT_PER_SOURCE: ${NEWS_LIMIT_PER_SOURCE:-50}
      NEWS_LIMIT_NEWEST_DATE: ${NEWS_LIMIT_NEWEST_DATE:-}
    networks: [news-private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8094/healthz']
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
networks:
  news-private:
    external: true
    name: ${NEWS_PROCESSING_NETWORK:?Set existing private network}
