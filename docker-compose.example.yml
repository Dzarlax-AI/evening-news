services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment: &app-environment
      DATABASE_URL: postgresql+asyncpg://newsuser:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/newsdb
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      GEMINI_API_ENDPOINT: https://generativelanguage.googleapis.com/v1/models
      SUMMARIZATION_MODEL: ${SUMMARIZATION_MODEL:-gemini-2.0-flash}
      CATEGORIZATION_MODEL: ${CATEGORIZATION_MODEL:-gemini-2.0-flash}
      DIGEST_MODEL: ${DIGEST_MODEL:-gemini-2.0-flash}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?Set TELEGRAM_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID}
      TELEGRAM_SERVICE_CHAT_ID: ${TELEGRAM_SERVICE_CHAT_ID:-}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:8000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ALLOW_CREATE_ALL: "true"
      BACKGROUND_EXECUTION_MODE: worker
      ARTICLE_AI_TOKEN: ${ARTICLE_AI_TOKEN:?Set ARTICLE_AI_TOKEN}
      ARTICLE_PROCESSING_URL: http://article-processing:8094
      ARTICLE_PROCESSING_TOKEN: ${ARTICLE_PROCESSING_TOKEN:?Set ARTICLE_PROCESSING_TOKEN}
      ARTICLE_INGESTION_MODE: go
      ARTICLE_INGESTION_URL: http://article-ingestion:8093
      ARTICLE_INGESTION_TOKEN: ${ARTICLE_INGESTION_TOKEN:?Set ARTICLE_INGESTION_TOKEN}
      SCHEDULE_DISPATCH_MODE: service
      SCHEDULER_ENABLED: "false"
      SCHEDULER_API_URL: http://scheduler:8080
      SCHEDULER_API_TOKEN: ${SCHEDULER_API_TOKEN:?Set SCHEDULER_API_TOKEN}
      SCHEDULER_API_ALLOW_HTTP: "true"
      SCHEDULED_JOBS_TOKEN: ${SCHEDULED_JOBS_TOKEN:?Set SCHEDULED_JOBS_TOKEN}
      SOURCE_MANAGER_MODE: go
      TELEGRAM_SOURCE_MODE: go
      PAGE_MONITOR_SOURCE_MODE: go
      EXTRACTION_SERVICE_MODE: go
      EXTRACTION_SERVICE_URL: http://extractor:8080
      EXTRACTION_SERVICE_TOKEN: ${EXTRACTION_SERVICE_TOKEN:?Set EXTRACTION_SERVICE_TOKEN}
      EXTRACTION_SERVICE_PYTHON_FALLBACK: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEVELOPMENT: ${DEVELOPMENT:-false}
      MAX_WORKERS: ${MAX_WORKERS:-5}
      CACHE_DIR: /app/cache
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,web}
    depends_on:
      postgres:
        condition: service_healthy
      article-ingestion:
        condition: service_healthy
      extractor:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    volumes:
      - app_cache:/app/cache:ro
      - app_logs:/app/logs
      - app_backups:/app/backups:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  executor:
    stop_grace_period: 180s
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "news_aggregator.executor"]
    environment:
      <<: *app-environment
      JOB_EXECUTOR_TOKEN: ${JOB_EXECUTOR_TOKEN:?Set JOB_EXECUTOR_TOKEN}
      JOB_EXECUTOR_HOST: 0.0.0.0
      JOB_EXECUTOR_PORT: "8100"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - app_cache:/app/cache
      - app_backups:/app/backups
      - executor_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request; req=urllib.request.Request('http://127.0.0.1:8100/internal/v1/status',headers={'Authorization':'Bearer '+os.environ['JOB_EXECUTOR_TOKEN']}); assert json.load(urllib.request.urlopen(req,timeout=5))['ready']"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 3

  worker:
    stop_grace_period: 180s
    build:
      context: .
      dockerfile: go-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://newsuser:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/newsdb
      JOB_EXECUTOR_URL: http://executor:8100
      JOB_EXECUTOR_TOKEN: ${JOB_EXECUTOR_TOKEN:?Set JOB_EXECUTOR_TOKEN}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      WORKER_SHUTDOWN_DRAIN_SECONDS: ${WORKER_SHUTDOWN_DRAIN_SECONDS:-20}
      WORKER_MAX_JOB_ATTEMPTS: ${WORKER_MAX_JOB_ATTEMPTS:-3}
      WORKER_JOB_RETENTION_DAYS: ${WORKER_JOB_RETENTION_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      executor:
        condition: service_healthy
      article-processing:
        condition: service_healthy
    restart: unless-stopped

  article-ingestion:
    build:
      context: .
      dockerfile: go-ingestion/Dockerfile
    environment:
      ARTICLE_INGESTION_LISTEN: ":8093"
      ARTICLE_INGESTION_TOKEN: ${ARTICLE_INGESTION_TOKEN:?Set ARTICLE_INGESTION_TOKEN}
      ARTICLE_INGESTION_DB_MAX_CONNS: ${ARTICLE_INGESTION_DB_MAX_CONNS:-5}
      DATABASE_URL: postgres://newsuser:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/newsdb
      EXTRACTION_SERVICE_URL: http://extractor:8080
      EXTRACTION_SERVICE_TOKEN: ${EXTRACTION_SERVICE_TOKEN:?Set EXTRACTION_SERVICE_TOKEN}
      EXTRACTION_SERVICE_NATIVE_BROWSER: "false"
      JOB_EXECUTOR_URL: http://executor:8100
      JOB_EXECUTOR_TOKEN: ${JOB_EXECUTOR_TOKEN:?Set JOB_EXECUTOR_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      extractor:
        condition: service_healthy
    restart: unless-stopped

  article-processing:
    build:
      context: .
      dockerfile: go-processing/Dockerfile
    environment:
      ARTICLE_PROCESSING_LISTEN: ":8094"
      ARTICLE_PROCESSING_TOKEN: ${ARTICLE_PROCESSING_TOKEN:?Set ARTICLE_PROCESSING_TOKEN}
      ARTICLE_PROCESSING_DB_MAX_CONNS: "5"
      DATABASE_URL: postgres://newsuser:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/newsdb
      ARTICLE_AI_URL: http://executor:8100
      ARTICLE_AI_TOKEN: ${ARTICLE_AI_TOKEN:?Set ARTICLE_AI_TOKEN}
      EXTRACTION_SERVICE_URL: http://extractor:8080
      EXTRACTION_SERVICE_TOKEN: ${EXTRACTION_SERVICE_TOKEN:?Set EXTRACTION_SERVICE_TOKEN}
      MAX_WORKERS: ${MAX_WORKERS:-5}
      PROCESSING_BATCH_SIZE: ${PROCESSING_BATCH_SIZE:-25}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
      PROCESSING_RETRY_INITIAL_SECONDS: ${PROCESSING_RETRY_INITIAL_SECONDS:-1800}
      PROCESSING_RETRY_LATER_SECONDS: ${PROCESSING_RETRY_LATER_SECONDS:-21600}
      PROCESSING_ATTEMPT_TIMEOUT_SECONDS: ${PROCESSING_ATTEMPT_TIMEOUT_SECONDS:-600}
      EXTRACTION_HTTP_MAX_BYTES: ${EXTRACTION_HTTP_MAX_BYTES:-5242880}
      EXTRACTION_TEXT_MAX_CHARS: ${EXTRACTION_TEXT_MAX_CHARS:-100000}
      NEWS_LIMIT_ENABLED: ${NEWS_LIMIT_ENABLED:-false}
      NEWS_LIMIT_DAYS: ${NEWS_LIMIT_DAYS:-1}
      NEWS_LIMIT_MAX_ARTICLES: ${NEWS_LIMIT_MAX_ARTICLES:-50}
      NEWS_LIMIT_PER_SOURCE: ${NEWS_LIMIT_PER_SOURCE:-50}
      NEWS_LIMIT_NEWEST_DATE: ${NEWS_LIMIT_NEWEST_DATE:-}
    depends_on:
      postgres:
        condition: service_healthy
      extractor:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newsdb
      POSTGRES_USER: newsuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsuser -d newsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  extractor:
    build:
      context: ./go
      dockerfile: ../docker/Dockerfile.extractor
    environment:
      LISTEN_ADDR: ":8080"
      EXTRACTOR_SERVICE_TOKEN: ${EXTRACTION_SERVICE_TOKEN:?Set EXTRACTION_SERVICE_TOKEN}
      EXTRACTOR_MAX_CONCURRENT: ${EXTRACTOR_MAX_CONCURRENT:-4}
      EXTRACTOR_BROWSER_CONCURRENT: ${EXTRACTOR_BROWSER_CONCURRENT:-2}
      EXTRACTOR_HTTP_ONLY: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/extract-service", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3

  scheduler:
    build:
      context: ./go-scheduler
      dockerfile: Dockerfile
    environment:
      LISTEN_ADDR: ":8080"
      SCHEDULER_DATABASE_URL: postgres://scheduler:${SCHEDULER_DB_PASSWORD:?Set SCHEDULER_DB_PASSWORD}@scheduler-postgres:5432/schedulerdb
      SCHEDULER_DB_SCHEMA: scheduler_service
      SCHEDULER_API_TOKEN: ${SCHEDULER_API_TOKEN:?Set SCHEDULER_API_TOKEN}
      SCHEDULER_TARGET_ALIASES: news-worker
      SCHEDULER_TARGET_NEWS_WORKER_URL: http://web:8000/api/v1/internal/scheduled-jobs
      SCHEDULER_TARGET_NEWS_WORKER_TOKEN: ${SCHEDULED_JOBS_TOKEN:?Set SCHEDULED_JOBS_TOKEN}
      SCHEDULER_ALLOW_HTTP_TARGETS: "true"
    depends_on:
      scheduler-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/scheduler", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3

  scheduler-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schedulerdb
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${SCHEDULER_DB_PASSWORD:?Set SCHEDULER_DB_PASSWORD}
    volumes:
      - scheduler_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d schedulerdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  scheduler_postgres_data:
  app_cache:
  app_logs:
  executor_logs:
  app_backups:
