services:
  browser:
    image: cloakhq/cloakbrowser@sha256:61dee1b490ee8f74b040bc02c3d5384c7f64420b87ccaa26a33f213d07df3f73
    command:
      - cloakserve
      - --port=9222
    environment:
      - CLOAKBROWSER_AUTO_UPDATE=false
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9222/json/version >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
